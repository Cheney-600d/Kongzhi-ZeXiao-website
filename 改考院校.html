<style>
*{margin:0;padding:0;box-sizing:border-box}

.date-cell{font-size:13px;color:#3e4146;font-weight:500;white-space:nowrap}

.empty{text-align:center;padding:60px 20px;color:#777a80}
.empty-icon{font-size:48px;margin-bottom:12px}.empty-icon svg{width:46px;height:46px;display:block;margin:0 auto;color:#c9ccd1;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:square;stroke-linejoin:round}

  /* 改考信息卡片（手机端使用） */

  .gk-card__major{font-size:13.5px;font-weight:600;color:#17191d;margin-bottom:10px;line-height:1.5}
  .gk-card__change{background:#f8f6f2;border-radius:10px;padding:10px 12px;margin-bottom:8px}
  .gk-card__label{display:block;font-size:11px;color:#9a9da3;font-weight:700;margin-bottom:4px}

.footer{text-align:center;padding:30px;color:#777a80;font-size:12.5px;line-height:1.8}

<script>
const examData=[{"level":"双非","school":"河南大学","college":"人工智能学院","major":"控制工程(085406)专硕/控制科学与工程学硕","before":"","after":"初试由《自动控制原理、信号与系统》调整为仅考《自动控制理论》(849)；学硕专硕统一考849","date":"2026.7.18","source":"http://ai.henu.edu.cn/info/1085/17512.htm","note":"河南大学人工智能学院官方“考试科目变更通知”，已核实"},{"level":"211","school":"长安大学","college":"电子与控制工程学院","major":"交通运输工程、交通运输；卓越工程师学院：交通运输（智慧交通控制）","before":"","after":"由813计算机系统及控制技术调整为812自动控制理论","date":"2026.1.5","source":"https://yzb.chd.edu.cn/2025/0715/c2769a253860/page.htm","note":"长安大学研究生招生办公室官方“关于调整2026年部分学科专业硕士研究生招生考试初试科目的公告”，明确813计算机系统及控制技术→812自动控制理论，已核实"},{"level":"985","school":"吉林大学","college":"通信工程学院","major":"所有硕士招生专业","before":"","after":"2027年起初试专业课统一改为“模拟与数字电子技术”，原812自动控制原理退出初试","date":"2026.5.10","source":"https://dce.jlu.edu.cn/info/1032/11314.htm","note":"吉林大学通信工程学院官方“硕士研究生招生考试科目变更的通知”，已核实"},{"level":"985","school":"重庆大学","college":"自动化学院","major":"电子信息（专硕）","before":"","after":"26考研首年改考844自动控制原理二","date":"2026.8.14","source":"https://yz.cqu.edu.cn/sszyml/2026/13.html","note":"重庆大学研究生招生信息网“自动化学院2026年硕士招生专业目录”，844自动控制原理二已列入；未检索到单独变更公告页"},{"level":"211","school":"华北电力大学(保定)","college":"自动化系","major":"控制科学与工程、控制工程","before":"","after":"专业课由819自动控制理论改为841自动控制理论","date":"2026.6.25","source":"https://zdh.ncepu.edu.cn/tzgg1/41bf4d3bde454052a0e91807ccac9530.htm","note":"华电自动化系官方2026年调整公告；注意该页考试科目写为820自动控制理论，与文章所述819→841不一致，建议以官方目录/大纲为准"},{"level":"双非","school":"江苏科技大学","college":"自动化学院","major":"控制科学与工程(学硕)、控制工程(专硕)、低空技术与工程(学硕)、仪器仪表工程(专硕)","before":"","after":"26年学硕/专硕专业课均由电路基础改为808自动控制原理","date":"2026.6.23","source":"https://yjsb.just.edu.cn/2025/0728/c7124a365228/page.htm","note":"江苏科技大学研究生院官方“2026年硕士研究生初试自命题科目调整说明”，正文列出自动化学院调整链接（原学院页已失效），未直接列出808明细"},{"level":"985","school":"哈尔滨工业大学","college":"航天学院","major":"082500航空宇航科学与技术(学硕)、085500机械(专硕)","before":"","after":"初试专业课改为807航空宇航控制原理；807仅考自动控制原理前六章，不再考理论力学","date":"2026.8.9","source":"http://sa.hit.edu.cn/_t856/2026/0731/c6582a398910/page.htm","note":"哈工大航天学院官方“2027年硕士研究生招生考试考试科目调整的公告”，已核实"},{"level":"985","school":"北京航空航天大学","college":"无人系统研究院","major":"085410人工智能(专硕)","before":"","after":"2027年初试第四单元考试科目调整为833控制工程综合","date":"2026.7.17","source":"https://wrj.buaa.edu.cn/info/1178/3057.htm","note":"北航无人系统研究院官方“2027年硕士研究生初试第四单元考试科目公告”，已核实"}];

function parseDate(d){const [y,m,day]=d.split('.');return parseInt(y,10)*10000+parseInt(m,10)*100+parseInt(day||'0',10);}
examData.sort((a,b)=>parseDate(b.date)-parseDate(a.date));

function getLevelClass(l){return'level-'+l.replace(/[（）]/g,'')}
function getLevelShort(l){if(l==='普通院校'||l==='普通本科')return'普通';return l}

function getAfterClass(after){
  if(!after)return'';
  if(after.includes('停止招生'))return'stop';
  if(after.includes('408'))return's408';
  return'';
}

function isPublicChange(before,after){
  const p=/数一|数二|英一|英二|数学一|数学二|英语一|英语二/;
  return p.test(before)||p.test(after);
}

function renderTable(data){
  const tbody=document.getElementById('tableBody');
  const empty=document.getElementById('emptyState');
  const cardEmpty=document.getElementById('cardEmptyState');
  const countEl=document.getElementById('resultCount');
  if(data.length===0){
    tbody.innerHTML='';
    empty.style.display='block';
    if(cardEmpty) cardEmpty.style.display='block';
    countEl.textContent='';
    renderCards([]);
    return;
  }
  empty.style.display='none';
  if(cardEmpty) cardEmpty.style.display='none';
  countEl.textContent='共 '+data.length+' 条';
  
  var prevSchool='';
  var schoolBefore='';
  var schoolAfter='';
  var schoolDate='';
  var schoolLevel='';
  
  tbody.innerHTML=data.map(function(r,i){
    var levelCls=getLevelClass(r.level);
    var levelShort=getLevelShort(r.level);
    var afterCls=getAfterClass(r.after);
    
    var isNewSchool=r.school!==prevSchool;
    if(isNewSchool){
      prevSchool=r.school;
      schoolBefore=r.before||'';
      schoolAfter=r.after||'';
      schoolDate=r.date||'';
      schoolLevel=r.level||'';
    }
    
    var beforeVal=r.before||schoolBefore||'—';
    var afterVal=r.after||schoolAfter||'—';
    var dateVal=r.date||schoolDate||'待确认';
    var levelVal=r.level||schoolLevel;
    var levelCls2=getLevelClass(levelVal);
    var levelShort2=getLevelShort(levelVal);
    
    var sourceUrl=r.source||'';
    var collegeDisplay=r.college||'—';
    var majorDisplay=r.major||'—';
    var publicTag=isPublicChange(r.before,r.after)?'<div class="public-tag">🎓 公共课改考</div>':'';
    
    return '<tr>'+
      '<td class="date-cell">'+dateVal+'</td>'+
      '<td><span class="level-tag '+levelCls2+'">'+levelShort2+'</span></td>'+
      '<td><a href="index.html?school='+encodeURIComponent(r.school)+'&from='+encodeURIComponent('改考院校.html')+'" class="school-name" style="text-decoration:none;cursor:pointer;" title="点击跳转到'+r.school+'详情">'+r.school+'</a></td>'+
      '<td><div class="college-text">'+collegeDisplay+'</div></td>'+
      '<td><div class="major-text">'+majorDisplay+'</div></td>'+
      '<td>'+publicTag+'<div class="after-text '+afterCls+'">'+afterVal+'</div>'+(r.note?'<div class="note-text">💡 '+r.note+'</div>':'')+'</td>'+
      '<td>'+(sourceUrl?'<a href="'+sourceUrl+'" target="_blank" class="source-link">🔗 戳我到院校官网</a>':'<span style="font-size:12px;color:#9a9da3">暂无链接</span>')+'</td>'+
    '</tr>';
  }).join('');
  renderCards(data);
}

function renderCards(data){
  const list=document.getElementById('cardList');
  const cardEmpty=document.getElementById('cardEmptyState');
  if(!list) return;
  if(data.length===0){
    list.innerHTML='';
    if(cardEmpty) cardEmpty.style.display='block';
    return;
  }
  if(cardEmpty) cardEmpty.style.display='none';
  list.innerHTML=data.map(function(r){
    var levelCls=getLevelClass(r.level);
    var levelShort=getLevelShort(r.level);
    var afterCls=getAfterClass(r.after);
    var publicTag=isPublicChange(r.before,r.after)?'<div class="public-tag">🎓 公共课改考</div>':'';
    var sourceUrl=r.source||'';
    var beforeHtml=r.before?'<div class="before-text" style="font-size:12px;">改前：'+r.before+'</div>':'';
    return '<div class="gk-card">'+
      '<div class="gk-card__head"><span class="level-tag '+levelCls+'">'+levelShort+'</span><span class="gk-card__date">'+(r.date||'待确认')+'</span></div>'+
      '<a class="gk-card__school" href="index.html?school='+encodeURIComponent(r.school)+'&from='+encodeURIComponent('改考院校.html')+'">'+r.school+'</a>'+
      '<div class="gk-card__college">'+(r.college||'—')+'</div>'+
      '<div class="gk-card__major">'+(r.major||'—')+'</div>'+
      '<div class="gk-card__change"><span class="gk-card__label">改动信息</span>'+beforeHtml+publicTag+'<div class="after-text '+afterCls+'">'+(r.after||'—')+'</div></div>'+
      (r.note?'<div class="gk-card__note">💡 '+r.note+'</div>':'')+
      (sourceUrl?'<a class="gk-card__source" href="'+sourceUrl+'" target="_blank">🔗 戳我到院校官网</a>':'<span style="font-size:12px;color:#9a9da3">暂无链接</span>')+
    '</div>';
  }).join('');
}

var currentFilter='all';
var currentType='all';
var searchQuery='';

function filterData(){
  var filtered=examData;
  if(currentFilter!=='all'){
    filtered=filtered.filter(function(d){return d.level===currentFilter;});
  }
  if(currentType==='verified'){
    filtered=filtered.filter(function(d){return (d.note||'').indexOf('已核实')>=0;});
  }else if(currentType==='pending'){
    filtered=filtered.filter(function(d){return (d.note||'').indexOf('已核实')<0;});
  }
  if(searchQuery){
    var q=searchQuery.toLowerCase();
    filtered=filtered.filter(function(d){
      return d.school.toLowerCase().includes(q)||
        (d.major&&d.major.toLowerCase().includes(q))||
        (d.before&&d.before.toLowerCase().includes(q))||
        (d.after&&d.after.toLowerCase().includes(q))||
        (d.college&&d.college.toLowerCase().includes(q));
    });
  }
  renderTable(filtered);
}

document.querySelectorAll('.filter-btn:not(.type-btn)').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.filter-btn:not(.type-btn)').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');
    currentFilter=btn.dataset.filter;
    filterData();
  });
});

document.querySelectorAll('.type-btn').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.type-btn').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');
    currentType=btn.dataset.type;
    filterData();
  });
});

document.getElementById('searchInput').addEventListener('input',function(e){
  searchQuery=e.target.value.trim();
  filterData();
});

renderTable(examData);
</script>


<script id="entry-a11y-adapt-js">
(function(){
  function enhanceClickableKeyboard(){
    document.querySelectorAll('[onclick]:not(button):not(a):not(input):not(select):not(textarea)').forEach(function(el){
      if(!el.hasAttribute('tabindex')) el.setAttribute('tabindex','0');
      if(!el.hasAttribute('role')) el.setAttribute('role','button');
      if(el.dataset.keyEnhanced === '1') return;
      el.dataset.keyEnhanced = '1';
      el.addEventListener('keydown', function(e){
        if(e.key === 'Enter' || e.key === ' '){
          e.preventDefault();
          el.click();
        }
      });
    });
  }
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', enhanceClickableKeyboard);
  }else{
    enhanceClickableKeyboard();
  }
})();
</script>
