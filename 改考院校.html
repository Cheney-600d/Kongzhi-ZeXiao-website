function parseDate(d){const [y,m,day]=d.split('.');return parseInt(y,10)*10000+parseInt(m,10)*100+parseInt(day||'0',10);}
examData.sort((a,b)=>parseDate(b.date)-parseDate(a.date));

function getLevelClass(l){return'level-'+l.replace(/[（）]/g,'')}
function getLevelShort(l){if(l==='普通院校'||l==='普通本科')return'普通';return l}

function getAfterClass(after){
  if(!after)return'';
  if(after.includes('停止招生'))return'stop';
  if(after.includes('408'))return's408';
  return'';
}

function isPublicChange(before,after){
  const p=/数一|数二|英一|英二|数学一|数学二|英语一|英语二/;
  return p.test(before)||p.test(after);
}

function renderTable(data){
  const tbody=document.getElementById('tableBody');
  const empty=document.getElementById('emptyState');
  const countEl=document.getElementById('resultCount');
  if(data.length===0){
    tbody.innerHTML='';
    empty.style.display='block';
    countEl.textContent='';
    return;
  }
  empty.style.display='none';
  countEl.textContent='共 '+data.length+' 条';
  
  var prevSchool='';
  var schoolBefore='';
  var schoolAfter='';
  var schoolDate='';
  var schoolLevel='';
  
  tbody.innerHTML=data.map(function(r,i){
    var levelCls=getLevelClass(r.level);
    var levelShort=getLevelShort(r.level);
    var afterCls=getAfterClass(r.after);
    
    var isNewSchool=r.school!==prevSchool;
    if(isNewSchool){
      prevSchool=r.school;
      schoolBefore=r.before||'';
      schoolAfter=r.after||'';
      schoolDate=r.date||'';
      schoolLevel=r.level||'';
    }
    
    var beforeVal=r.before||schoolBefore||'—';
    var afterVal=r.after||schoolAfter||'—';
    var dateVal=r.date||schoolDate||'待确认';
    var levelVal=r.level||schoolLevel;
    var levelCls2=getLevelClass(levelVal);
    var levelShort2=getLevelShort(levelVal);
    
    var sourceUrl=r.source||'';
    var collegeDisplay=r.college||'—';
    var majorDisplay=r.major||'—';
    var publicTag=isPublicChange(r.before,r.after)?'<div class="public-tag">🎓 公共课改考</div>':'';
    
    return '<tr>'+
      '<td class="date-cell">'+dateVal+'</td>'+
      '<td><span class="level-tag '+levelCls2+'">'+levelShort2+'</span></td>'+
      '<td><a href="index.html?school='+encodeURIComponent(r.school)+'&from='+encodeURIComponent('改考院校.html')+'" class="school-name" style="text-decoration:none;cursor:pointer;" title="点击跳转到'+r.school+'详情">'+r.school+'</a></td>'+
      '<td><div class="college-text">'+collegeDisplay+'</div></td>'+
      '<td><div class="major-text">'+majorDisplay+'</div></td>'+
      '<td><div class="before-text">'+beforeVal+'</div></td>'+
      '<td>'+publicTag+'<div class="after-text '+afterCls+'">'+afterVal+'</div>'+(r.note?'<div class="note-text">💡 '+r.note+'</div>':'')+'</td>'+
      '<td>'+(sourceUrl?'<a href="'+sourceUrl+'" target="_blank" class="source-link">🔗 戳我到院校官网</a>':'<span style="font-size:12px;color:#9a9da3">暂无链接</span>')+'</td>'+
    '</tr>';
  }).join('');
}

var currentFilter='all';
var searchQuery='';

function filterData(){
  var filtered=examData;
  if(currentFilter!=='all'){
    if(currentFilter==='普通')filtered=filtered.filter(function(d){return d.level==='普通院校'||d.level==='普通本科';});
    else filtered=filtered.filter(function(d){return d.level===currentFilter;});
  }
  if(searchQuery){
    var q=searchQuery.toLowerCase();
    filtered=filtered.filter(function(d){
      return d.school.toLowerCase().includes(q)||
        (d.major&&d.major.toLowerCase().includes(q))||
        (d.before&&d.before.toLowerCase().includes(q))||
        (d.after&&d.after.toLowerCase().includes(q))||
        (d.college&&d.college.toLowerCase().includes(q));
    });
  }
  renderTable(filtered);
}

document.querySelectorAll('.filter-btn').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');
    currentFilter=btn.dataset.filter;
    filterData();
  });
});

document.getElementById('searchInput').addEventListener('input',function(e){
  searchQuery=e.target.value.trim();
  filterData();
});

renderTable(examData);
</script>


<script id="entry-a11y-adapt-js">
(function(){
  function enhanceClickableKeyboard(){
    document.querySelectorAll('[onclick]:not(button):not(a):not(input):not(select):not(textarea)').forEach(function(el){
      if(!el.hasAttribute('tabindex')) el.setAttribute('tabindex','0');
      if(!el.hasAttribute('role')) el.setAttribute('role','button');
      if(el.dataset.keyEnhanced === '1') return;
      el.dataset.keyEnhanced = '1';
      el.addEventListener('keydown', function(e){
        if(e.key === 'Enter' || e.key === ' '){
          e.preventDefault();
          el.click();
        }
      });
    });
  }
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', enhanceClickableKeyboard);
  }else{
    enhanceClickableKeyboard();
  }
})();
</script>
