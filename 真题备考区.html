<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>真题备考区｜万人教育</title>
  <meta name="description" content="领取控制类考研真题资料，查看真题配套讲解视频。">
  <link rel="icon" type="image/png" href="assets/wanren-education-logo.png">
  <link rel="stylesheet" href="vendor/font-awesome/css/all.min.css">
  <link rel="stylesheet" href="exam-resources.css?v=20260828">
  <link rel="stylesheet" href="exam-resources-refinement.css?v=20260829">
</head>
<body>
  <header class="exam-site-header">
    <a class="exam-brand" href="index.html" aria-label="返回择校首页">
      <img src="assets/wanren-education-logo.png" alt="万人教育">
      <span><strong>万人教育</strong><small>控制考研择校与备考</small></span>
    </a>
    <nav aria-label="页面导航">
      <a href="index.html"><i class="fa-solid fa-house" aria-hidden="true"></i>择校首页</a>
      <a href="数据库/admin.html"><i class="fa-solid fa-gear" aria-hidden="true"></i>内容后台</a>
    </nav>
  </header>

  <main>
    <section class="exam-hero" aria-labelledby="examTitle">
      <div class="exam-hero__copy">
        <p class="exam-kicker"><span>05</span> 真题与复习</p>
        <h1 id="examTitle">真题备考区</h1>
        <p>先领取目标院校真题资料，再跟随配套讲解逐题建立解题框架。所有资料与视频由后台统一维护。</p>
        <div class="exam-hero__actions">
          <a class="exam-button exam-button--primary" href="#resourceBoard">领取真题资料<i class="fa-solid fa-arrow-down" aria-hidden="true"></i></a>
          <a class="exam-button" href="#videoBoard">查看配套讲解<i class="fa-solid fa-circle-play" aria-hidden="true"></i></a>
        </div>
      </div>
      <aside class="exam-hero__guide" aria-label="使用步骤">
        <span class="exam-guide-label">使用顺序</span>
        <ol>
          <li><b>01</b><span><strong>领取资料</strong><small>从百度云保存真题文件</small></span></li>
          <li><b>02</b><span><strong>独立作答</strong><small>先计时完成，再核对思路</small></span></li>
          <li><b>03</b><span><strong>配套精讲</strong><small>跟随视频补齐方法与盲点</small></span></li>
        </ol>
      </aside>
    </section>

    <section id="resourceBoard" class="exam-board" aria-labelledby="resourceTitle">
      <header class="exam-board__header">
        <div><span class="exam-board__index">01 / MATERIALS</span><h2 id="resourceTitle">领取真题资料</h2><p>已发布的百度云资料入口会展示在这里。</p></div>
        <i class="fa-solid fa-cloud-arrow-down" aria-hidden="true"></i>
      </header>
      <div id="resourceList" class="resource-list" aria-live="polite">
        <div class="exam-loading"><i class="fa-solid fa-circle-notch fa-spin" aria-hidden="true"></i>正在加载资料…</div>
      </div>
    </section>

    <section id="videoBoard" class="exam-board" aria-labelledby="videoTitle">
      <header class="exam-board__header">
        <div><span class="exam-board__index">02 / VIDEO LESSONS</span><h2 id="videoTitle">真题配套讲解</h2><p>B 站真题精讲视频按后台排序展示。</p></div>
        <i class="fa-solid fa-circle-play" aria-hidden="true"></i>
      </header>
      <div id="videoList" class="video-list" aria-live="polite">
        <div class="exam-loading"><i class="fa-solid fa-circle-notch fa-spin" aria-hidden="true"></i>正在加载视频…</div>
      </div>
    </section>
  </main>

  <footer class="exam-footer"><span>万人教育 · 真题备考区</span><a href="index.html">返回择校路线</a></footer>
  <script src="exam-resources.js?v=20260829" defer></script>
</body>
</html>
