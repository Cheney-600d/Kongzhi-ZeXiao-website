    items.forEach(function (prj, idx) {
      html += '<div class="card" style="margin-bottom:20px;">';
      html += '<div class="card-title"><span class="icon">🤖</span>' + esc(prj.title) + '</div>';
      html += '<p style="margin-top:8px;"><strong>核心技术栈：</strong>' + prj.stack.map(esc).join('、') + '</p>';
      html += '<p><strong>适用方向：</strong>' + prj.directions.map(esc).join('、') + '</p>';
      html += '<div class="tip-box success" style="margin-top:8px;"><strong>包装亮点：</strong>' + esc(prj.highlights) + '</div>';
      html += '<p style="margin-top:8px;"><strong>项目简介：</strong>' + esc(prj.intro) + '</p>';
      html += '<p><strong>关键技术点：</strong></p><ul>';
      prj.points.forEach(function (pt) {
        html += '<li><strong>' + esc(pt.name) + '：</strong>' + esc(pt.desc) + '</li>';
      });
      html += '</ul>';
      html += '<p><strong>面试问答：</strong></p><div class="qa-list">';
      prj.qa.forEach(function (qa) {
        html += '<div class="qa-item"><div class="qa-question" onclick="toggleProjectQa(this)">' + esc(qa.q) + '<span class="arrow">▼</span></div><div class="qa-answer"><p>' + esc(qa.a) + '</p></div></div>';
      });
      html += '</div></div>';
    });
    listEl.innerHTML = html;
  }

  window.toggleProjectQa = function (el) {
    var answer = el.nextElementSibling;
    if (answer) {
      var show = answer.style.display !== 'block';
      answer.style.display = show ? 'block' : 'none';
      var arrow = el.querySelector('.arrow');
      if (arrow) arrow.textContent = show ? '▲' : '▼';
    }
  };

  searchInput.addEventListener('input', render);
  render();
})();
</script>
