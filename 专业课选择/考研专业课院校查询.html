<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>27考研控制类专业课院校查询</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f7eceb;
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            padding: 40px 20px;
            color: #a92122;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 8px rgba(169,33,34,0.2);
        }
        
        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
            color: #2d2d3d;
        }
        
        .home-page {
            display: block;
        }
        
        .subject-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .subject-card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(169,33,34,0.2);
            position: relative;
            overflow: hidden;
        }
        
        .subject-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(169,33,34,0.35);
        }
        
        .subject-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #a92122, #a92122);
        }
        
        .subject-card.combo-card::before {
            background: linear-gradient(90deg, #f093fb, #f5576c);
        }
        
        .subject-card .card-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.15;
            z-index: 0;
            pointer-events: none;
        }
        
        .subject-card .card-content {
            position: relative;
            z-index: 1;
        }
        
                
        .subject-card h2 {
            font-size: 1.4rem;
            color: #333;
            margin-bottom: 15px;
            padding-right: 50px;
        }
        
        .subject-card .stats {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .stat-item {
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(4px);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #555;
            border: 1px solid rgba(0,0,0,0.05);
        }
        
        .stat-item .count {
            color: #a92122;
            font-weight: bold;
        }
        
        .combo-badge {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            margin-left: 8px;
            vertical-align: middle;
        }
        
        .arrow {
            position: absolute;
            right: 20px;
            bottom: 20px;
            font-size: 1.5rem;
            color: #a92122;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1;
        }
        
        .subject-card:hover .arrow {
            opacity: 1;
        }
        
        .difficulty-banner {
            display: block;
            width: 100%;
            max-width: 1160px;
            margin: 0 auto 24px;
            padding: 20px 24px;
            background: linear-gradient(135deg, #FF6B35 0%, #F7931E 50%, #FF6B35 100%);
            color: #fff;
            font-size: 1.4rem;
            font-weight: 700;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.35);
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.25s, box-shadow 0.25s;
            border: none;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }
        
        .difficulty-banner::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: rotate(30deg);
            animation: shimmer 3s infinite;
        }
        
        @keyframes shimmer {
            0% { transform: translateX(-100%) rotate(30deg); }
            50% { transform: translateX(100%) rotate(30deg); }
            100% { transform: translateX(100%) rotate(30deg); }
        }
        
        .difficulty-banner:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 24px rgba(255, 107, 53, 0.45);
        }
        
        .difficulty-banner .sub {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            opacity: 0.95;
            margin-top: 4px;
            letter-spacing: 0;
            position: relative;
            z-index: 1;
        }
        
        /* 详情页 */
        .detail-page {
            display: none;
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-top: 20px;
            box-shadow: 0 4px 12px rgba(169,33,34,0.2);
        }
        
        .detail-page.active {
            display: block;
        }
        
        .detail-header {

            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e2d7d7;
            flex-wrap: wrap;

        .detail-header h2 {

        .back-btn:hover {

        .school-detail-page {

            border-radius: 12px;

            margin-top: 20px;

        }

        }
        
        .school-detail-header {

            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e2d7d7;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .school-detail-header h2 {
            font-size: 1.8rem;
            color: #333;
        }
        
        .school-info-bar .info-item {

            opacity: 0.8;

        }
        
        .school-info-bar .info-value {
            font-weight: bold;
        }
        
        .subject-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }
        
        .subject-item {
            background: #f8f9fa;

            padding: 20px;

        }
        
        .subject-item:hover {

        .subject-item-name {

        .subject-item-meta {

        .subject-item-code {

        .subject-item-tier.tier-211,

        .school-card:nth-child(even) {

        }
        
        .no-subjects {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-size: 1.2rem;
        }
        
        .filter-bar {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 12px rgba(169,33,34,0.2);
        }
        
        .filter-section {
            margin-bottom: 15px;
        }
        
        .filter-section:last-child {
            margin-bottom: 0;
        }
        
        .filter-label {
            font-weight: bold;
            color: #555;
            margin-bottom: 10px;
            display: block;
            font-size: 0.95rem;
        }
        
        .filter-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .filter-btn {

            border: 2px solid #e2d7d7;

        .schools-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }
        
        .tier-section {

        }
        
        .tier-title {
            font-size: 1.3rem;
            color: #a92122;
            margin-bottom: 15px;
            padding-left: 15px;
            border-left: 4px solid #a92122;
        }
        
        .tier-section[data-tier="985高校"] .tier-title { color: #e53e3e; border-left-color: #e53e3e; }
        .tier-section[data-tier="211高校"] .tier-title { color: #dd6b20; border-left-color: #dd6b20; }
                        .tier-section[data-tier="普通高校"] .tier-title { color: #4299e1; border-left-color: #4299e1; }
        
        .combo-section {
            margin-bottom: 40px;
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 12px rgba(169,33,34,0.2);
        }
        
        .combo-section:last-child {

        }
        
        .combo-name {

            font-weight: bold;

            margin-bottom: 20px;

            border-bottom: 2px dashed #e2d7d7;
        }
        
        .school-card {
            background: white;
            border-radius: 12px;
            padding: 15px 20px;
            transition: all 0.3s;
            border: 2px solid transparent;
            box-shadow: 0 2px 8px rgba(169,33,34,0.15);

            overflow: hidden;
            cursor: pointer;
        }
        
        .view-data-btn {
            display: inline-block;
            margin-top: 8px;
            padding: 4px 10px;
            background: linear-gradient(135deg, #a92122, #a92122);
            color: #fff;
            border-radius: 6px;

            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
        }
        .view-data-btn:hover { opacity: 0.85; transform: translateY(-1px); }
        .view-data-btn.tier-985 { background: linear-gradient(135deg, #e53e3e, #c53030); }
        .view-data-btn.tier-211 { background: linear-gradient(135deg, #dd6b20, #c05621); }
        .view-data-btn.tier-sf { background: linear-gradient(135deg, #4299e1, #3182ce); }
        
        .school-card:hover {
            border-color: #a92122;
            transform: translateX(5px);
            box-shadow: 0 4px 12px rgba(169,33,34,0.25);
        }
        
        /* Tier-specific hover colors for school cards */
        .school-card:hover.tier-985 { border-color: #e53e3e; box-shadow: 0 4px 12px rgba(229,62,62,0.25); }
        .school-card:hover.tier-211 { border-color: #dd6b20; box-shadow: 0 4px 12px rgba(221,107,32,0.25); }
        .school-card:hover.tier-sf { border-color: #4299e1; box-shadow: 0 4px 12px rgba(66,153,225,0.25); }
        
        /* Subject-specific top bar colors */
        .subject-card.subject-signal::before { background: linear-gradient(90deg, #a92122, #a92122); }

        .subject-card.subject-digital::before { background: linear-gradient(90deg, #FFA726, #F57C00); }
        .subject-card.subject-em::before { background: linear-gradient(90deg, #66BB6A, #43A047); }
        .subject-card.subject-combo::before { background: linear-gradient(90deg, #f093fb, #f5576c); }
        .subject-card.subject-dsp::before { background: linear-gradient(90deg, #AB47BC, #8E24AA); }
        
        /* Tier-specific filter button active colors */

                    // 正常来自主站学校详情页：用 history.back() 精确恢复原详情条目，
                    // 不产生 from 参数/重复详情条目，"返回首页"与"返回上一级"均恢复正常。
                    // 仅当已在课程工具内深入浏览（push 过中间状态）时，才明确替换回主站详情。
                    const toolState = history.state && history.state.kzUiHistory && history.state.view;
                    if (toolState && toolState !== 'course-school-detail') {
                        location.replace(fallback);
                    } else {
                        history.back();
                    }
                    return false;
                }
                // 非详情页来源（如直接输入课程页 URL）：用带 school 参数的明确 URL
                // 替换回主站对应学校详情，保证父级确定性。
                location.replace(fallback);
            } else if (typeof window.siteHistoryBack === 'function') window.siteHistoryBack(fallback);
            else if (document.referrer && new URL(document.referrer, location.href).origin === location.origin) history.back();
            else location.href = fallback;
            return false;
        }

        let currentSubject = null;
        let currentTierFilter = 'all';
        let currentRegionFilter = 'all';
        let previousPage = 'home'; // 记录从哪个页面跳转到院校详情页
        
        
        function initHome() {
            const grid = document.getElementById('subjectGrid');
            grid.innerHTML = '';
            
            const subjectClassMap = {};
            
            homeSubjects.forEach((subject, index) => {
                const card = document.createElement('div');
                const subjClass = subjectClassMap[subject.name] || '';
                card.className = 'subject-card fade-in' + (subject.type === 'combo' ? ' combo-card' : '') + (subjClass ? ' ' + subjClass : '');
                card.style.animationDelay = index * 0.05 + 's';
                
                const tierCounts = {};
                let total = 0;
                for (const [tier, schools] of Object.entries(subject.tier)) {
                    if (subject.type === 'combo') {
                        let tierTotal = 0;
                        for (const comboSchools of Object.values(schools)) {
                            tierTotal += comboSchools.length;
                        }
                        tierCounts[tier] = tierTotal;
                        total += tierTotal;
                    } else {
                        tierCounts[tier] = schools.length;
                        total += schools.length;
                    }
                }
                
                let statsHtml = '';
                for (const [tier, count] of Object.entries(tierCounts)) {
                    statsHtml += `<div class="stat-item">${tier}: <span class="count">${count}</span></div>`;
                }
                
                let titleHtml = subject.name;
                if (subject.type === 'combo') {
                    titleHtml += `<span class="combo-badge">${subject.combo_list.length}种组合</span>`;
                }
                
                const bgStyle = subject.bgGradient || 'linear-gradient(135deg, #f5f5f5 0%, #ffffff 100%)';                
                card.innerHTML = `
                    <div class="card-bg" style="background: ${bgStyle};"></div>
                    <div class="card-content">
                        <h2>${titleHtml}</h2>
                        <div class="stats">
                            ${statsHtml}
                            <div class="stat-item">总计: <span class="count">${total}</span></div>
                        </div>
                    </div>
                    <div class="arrow">→</div>
                `;
                
                card.onclick = () => goToDetail(subject);
                grid.appendChild(card);
            });
        }
        
        function initRegionFilter() {
            const container = document.getElementById('regionFilter');
            const clearBtn = container.querySelector('.clear');
            
            allRegions.forEach(region => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.setAttribute('data-region', region);
                btn.textContent = region;
                btn.onclick = () => filterByRegion(region);
                container.insertBefore(btn, clearBtn);
            });
        }
        
        function goToDetail(subject) {
            currentSubject = subject;
            currentTierFilter = 'all';
            currentRegionFilter = 'all';
            
            document.getElementById('homePage').style.display = 'none';
            document.getElementById('detailPage').classList.add('active');
            document.getElementById('schoolDetailPage').classList.remove('active');
            document.getElementById('detailTitle').textContent = subject.name;
            
            document.querySelectorAll('#tierFilter .filter-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector('#tierFilter [data-tier="all"]').classList.add('active');
            document.querySelectorAll('#regionFilter .filter-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector('#regionFilter [data-region="all"]').classList.add('active');
            
            renderSchools();
            window.scrollTo(0, 0);
            
        
        }
        
        function goHome() {
            document.getElementById('homePage').style.display = 'block';
            document.getElementById('detailPage').classList.remove('active');
            document.getElementById('schoolDetailPage').classList.remove('active');
            currentSubject = null;
            window.scrollTo(0, 0);
            
        
        }
        
        // 跳转到院校详情页（反向查询）
        function goToSchoolDetail(schoolName) {
            previousPage = document.getElementById('detailPage').classList.contains('active') ? 'detail' : 'home';
            
            document.getElementById('homePage').style.display = 'none';
            document.getElementById('detailPage').classList.remove('active');
            document.getElementById('schoolDetailPage').classList.add('active');
            document.getElementById('schoolDetailTitle').textContent = schoolName;
            
            // 更新"查看择校数据"链接
            document.getElementById('schoolDetailLink').href = '../index.html?school=' + encodeURIComponent(schoolName) + '&from=' + encodeURIComponent('专业课选择/考研专业课院校查询.html');
            
            renderSchoolDetail(schoolName);
            window.scrollTo(0, 0);
        }
        
        // 从院校详情页返回
        function goBackFromSchool() {
            document.getElementById('schoolDetailPage').classList.remove('active');
            
            if (previousPage === 'detail' && currentSubject) {
                document.getElementById('detailPage').classList.add('active');
            } else {
                document.getElementById('homePage').style.display = 'block';
            }
            window.scrollTo(0, 0);
        }
        
        function getTierClass(tier) {
            const tierClassMap = {
                '985高校': 'tier-985',
                '211高校': 'tier-211',
                                                '普通高校': 'tier-sf'
            };
            return tierClassMap[tier] || 'tier-sf';
        }
        
        function renderSchoolDetail(schoolName) {
            const infoBar = document.getElementById('schoolInfoBar');
            const listContainer = document.getElementById('subjectList');
            const countEl = document.getElementById('schoolResultsCount');
            const titleEl = document.getElementById('schoolDetailTitle');
            
            const subjects = schoolIndex[schoolName] || [];
            
            // Update title with logo
            const logoPath = `images/校徽/${schoolName}.jpg`;
            titleEl.innerHTML = `<img class="school-logo-lg" src="${logoPath}" alt="${schoolName}校徽" onerror="this.style.display='none'" loading="lazy">${schoolName}`;
            
            // 统计信息
            const region = subjects.length > 0 ? subjects[0].region : '未知';
            const tierSet = new Set(subjects.map(s => s.tier));
            const tierList = Array.from(tierSet).join(' / ');
            
            infoBar.innerHTML = `
                <div class="info-item">
                    <span class="info-label">地区</span>
                    <span class="info-value">${region}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">涉及层次</span>
                    <span class="info-value">${tierList || '未知'}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">考察专业课数</span>
                    <span class="info-value">${subjects.length} 门</span>
                </div>
            `;
            
            countEl.innerHTML = `该院校共考察 <span>${subjects.length}</span> 门专业课`;
            
            if (subjects.length === 0) {
                listContainer.innerHTML = '<div class="no-subjects">😔 未找到该院校的专业课信息</div>';
                return;
            }
            
            listContainer.innerHTML = '';
            
            // 按层次排序
            const tierOrder = ['985高校', '211高校', '普通高校'];
            const sortedSubjects = [...subjects].sort((a, b) => {
                const idxA = tierOrder.indexOf(a.tier);
                const idxB = tierOrder.indexOf(b.tier);
                if (idxA !== idxB) return idxA - idxB;
                return a.subjectName.localeCompare(b.subjectName);
            });
            
            sortedSubjects.forEach((sub, index) => {
                const item = document.createElement('div');
                const tierCls = getTierClass(sub.tier);
                
                item.className = 'subject-item fade-in ' + tierCls;
                item.style.animationDelay = index * 0.05 + 's';
                
                const tierDisplayNames = {
                    '985高校': '985',
                    '211高校': '211',
                                                            '普通高校': '双非'
                };
                
                let codeHtml = '';
                const validCodes = (sub.codes || []).filter(c => c);
                if (validCodes.length === 1) {
                    codeHtml = `<span class="subject-item-code">代码: ${validCodes[0]}</span>`;
                } else if (validCodes.length > 1) {
                    codeHtml = `<span class="subject-item-code">代码: ${validCodes.join(' / ')}</span>`;
                } else {
                    codeHtml = `<span class="subject-item-code">代码: 无</span>`;
                }
                
                item.innerHTML = `
                    <div class="subject-item-name">${sub.subjectName}</div>
                    <div class="subject-item-meta">
                        ${codeHtml}
                        <span class="subject-item-tier ${tierCls}">${tierDisplayNames[sub.tier] || sub.tier}</span>
                        <span class="subject-item-region">${sub.region}</span>
                    </div>
                    <a href="../index.html?school=${encodeURIComponent(schoolName)}&from=${encodeURIComponent('专业课选择/考研专业课院校查询.html')}" class="view-data-btn ${tierCls}">📊 查看择校数据</a>
                `;
                
                // 点击专业课条目跳回该专业课的详情页（点击链接不触发）
                item.onclick = (e) => {
                    if (e.target.closest('a')) return;
                    const targetSubject = homeSubjects.find(s => s.name === sub.subjectName);
                    if (targetSubject) {
                        goToDetail(targetSubject);
                    }
                };
                
                listContainer.appendChild(item);
            });

            // 📚 初试参考书目
            const books = schoolBooks[schoolName];
            if (books && books.length > 0) {
                const bookSec = document.createElement('div');
                bookSec.className = 'book-section fade-in';
                let bookHtml = '<div class="book-section-title">📚 初试参考书目</div>';
                books.forEach(b => { bookHtml += `<div class="book-line">${b}</div>`; });
                bookSec.innerHTML = bookHtml;
                listContainer.appendChild(bookSec);
            }
        }
        
        function filterByTier(tier) {
            currentTierFilter = tier;
            document.querySelectorAll('#tierFilter .filter-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`#tierFilter [data-tier="${tier}"]`)?.classList.add('active');
            renderSchools();
        }
        
        function filterByRegion(region) {
            currentRegionFilter = region;
            document.querySelectorAll('#regionFilter .filter-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`#regionFilter [data-region="${region}"]`)?.classList.add('active');
            renderSchools();
        }
        
        function clearTierFilter() {
            filterByTier('all');
        }
        
        function clearRegionFilter() {
            filterByRegion('all');
        }
        
        function renderSchools() {
            if (!currentSubject) return;
            
            const container = document.getElementById('schoolsContainer');
            container.innerHTML = '';
            
            let filteredSchools = [];
            
            if (currentSubject.type === 'combo') {
                for (const [tierName, combos] of Object.entries(currentSubject.tier)) {
                    if (currentTierFilter !== 'all') {
                        if (currentTierFilter === '双非') {
                            if (tierName !== '普通高校') continue;
                        } else {
                            if (tierName !== currentTierFilter) continue;
                        }
                    }
                    
                    for (const [comboName, schools] of Object.entries(combos)) {
                        for (const school of schools) {
                            if (currentRegionFilter !== 'all' && school.region !== currentRegionFilter) continue;
                            
                            filteredSchools.push({
                                ...school,
                                tier: tierName,
                                comboName: comboName
                            });
                        }
                    }
                }
                
                document.getElementById('resultsCount').innerHTML = 
                    `共找到 <span>${filteredSchools.length}</span> 所院校`;
                
                if (filteredSchools.length === 0) {
                    container.innerHTML = '<div class="no-results">😔 没有找到符合条件的院校</div>';
                    return;
                }
                
                const comboGroups = {};
                for (const school of filteredSchools) {
                    if (!comboGroups[school.comboName]) {
                        comboGroups[school.comboName] = [];
                    }
                    comboGroups[school.comboName].push(school);
                }
                
                for (const [comboName, schools] of Object.entries(comboGroups)) {
                    const section = document.createElement('div');
                    section.className = 'combo-section fade-in';
                    
                    const tierOrder = ['985高校', '211高校', '普通高校'];
                    const tierDisplayNames = {
                        '985高校': '🔴 985',
                        '211高校': '🟠 211',
                                                                        '普通高校': '🔵 双非'
                    };
                    
                    let tierStats = [];
                    for (const tier of tierOrder) {
                        const count = schools.filter(s => s.tier === tier).length;
                        if (count > 0) tierStats.push(`${tierDisplayNames[tier]}: ${count}所`);
                    }
                    
                    section.innerHTML = `
                        <div class="combo-name">${comboName} <span style="font-size:0.85rem;color:#999;font-weight:normal;">(${tierStats.join(' | ')})</span></div>
                    `;
                    
                    const grid = document.createElement('div');
                    grid.className = 'schools-container';
                    
                    const sortedSchools = [];
                    for (const tier of tierOrder) {
                        sortedSchools.push(...schools.filter(s => s.tier === tier));
                    }
                    
                    sortedSchools.forEach((school, index) => {
                        const card = createSchoolCard(school, index);
                        grid.appendChild(card);
                    });
                    
                    section.appendChild(grid);
                    container.appendChild(section);
                }
                
            } else {
                for (const [tierName, schools] of Object.entries(currentSubject.tier)) {
                    if (currentTierFilter !== 'all') {
                        if (currentTierFilter === '双非') {
                            if (tierName !== '普通高校') continue;
                        } else {
                            if (tierName !== currentTierFilter) continue;
                        }
                    }
                    
                    for (const school of schools) {
                        if (currentRegionFilter !== 'all' && school.region !== currentRegionFilter) continue;
                        
                        filteredSchools.push({
                            ...school,
                            tier: tierName
                        });
                    }
                }
                
                document.getElementById('resultsCount').innerHTML = 
                    `共找到 <span>${filteredSchools.length}</span> 所院校`;
                
                if (filteredSchools.length === 0) {
                    container.innerHTML = '<div class="no-results">😔 没有找到符合条件的院校</div>';
                    return;
                }
                
                const tierOrder = ['985高校', '211高校', '普通高校'];
                const tierDisplayNames = {
                    '985高校': '🔴 985高校',
                    '211高校': '🟠 211高校',
                                                            '普通高校': '🔵 普通高校'
                };
                
                if (currentTierFilter !== 'all') {
                    const grid = document.createElement('div');
                    grid.className = 'schools-container';
                    filteredSchools.forEach((school, index) => {
                        const card = createSchoolCard(school, index);
                        grid.appendChild(card);
                    });
                    container.appendChild(grid);
                } else {
                    for (const tier of tierOrder) {
                        const tierSchools = filteredSchools.filter(s => s.tier === tier);
                        if (tierSchools.length === 0) continue;
                        
                        const section = document.createElement('div');
                        section.className = 'tier-section';
                        section.setAttribute('data-tier', tier);
                        section.innerHTML = `<div class="tier-title">${tierDisplayNames[tier] || tier} (${tierSchools.length}所)</div>`;
                        
                        const grid = document.createElement('div');
                        grid.className = 'schools-container';
                        
                        tierSchools.forEach((school, index) => {
                            const card = createSchoolCard(school, index);
                            grid.appendChild(card);
                        });
                        
                        section.appendChild(grid);
                        container.appendChild(section);
                    }
                }
            }
        }
        
        function createSchoolCard(school, index) {
            const card = document.createElement('div');
            const tierCls = getTierClass(school.tier);
            card.className = 'school-card fade-in ' + tierCls;
            card.style.animationDelay = index * 0.03 + 's';
            
            const tierDisplayNames = {
                '985高校': '985',
                '211高校': '211',
                                                '普通高校': '双非'
            };
            
            const logoPath = `images/校徽/${school.name}.jpg`;
            
            let codeHtml = '';
            if (school.codes && school.codes.length > 0) {
                const validCodes = school.codes.filter(c => c);
                if (validCodes.length === 1) {
                    codeHtml = `<span class="school-code">代码: ${validCodes[0]}</span>`;
                } else if (validCodes.length > 1) {
                    codeHtml = `<span class="school-code">代码: ${validCodes.join(' / ')}</span>`;
                } else {
                    codeHtml = `<span class="school-code">代码: 无</span>`;
                }
            } else {
                codeHtml = `<span class="school-code">代码: 无</span>`;
            }
            
            card.innerHTML = `
                <div class="school-name-wrap">
                    <img class="school-logo" src="${logoPath}" alt="${school.name}校徽" onerror="this.style.display='none'" loading="lazy">
                    <span class="school-name">${school.name}</span>
                </div>
                <div class="school-meta">
                    ${codeHtml}
                    <span class="school-region">${school.region}</span>
                    <span class="school-tier ${tierCls}">${tierDisplayNames[school.tier] || school.tier}</span>
                </div>
                <a href="../index.html?school=${encodeURIComponent(school.name)}&from=${encodeURIComponent('专业课选择/考研专业课院校查询.html')}" class="view-data-btn ${tierCls}">📊 查看择校数据</a>
            `;
            
            // 点击院校卡片跳转到院校详情页（反向查询）
            card.onclick = (e) => {
                // 如果点击的是链接，不触发卡片跳转
                if (e.target.closest('a')) return;
                e.stopPropagation();
                goToSchoolDetail(school.name);
            };
            
            return card;
        }
        
        // 页面加载时先获取表情包清单，再初始化
        document.addEventListener('DOMContentLoaded', () => {
            initHome();
            initRegionFilter();
            
            // 检查 URL 参数
            const urlParams = new URLSearchParams(window.location.search);
            
            // 如果有 subject 参数则自动跳转到专业课详情页
            const subjectParam = urlParams.get('subject');
            if (subjectParam) {
                const target = homeSubjects.find(s => s.name === subjectParam);
                if (target) {
                    goToDetail(target);
                }
            }
            
            // 如果有 school 参数则自动跳转到院校详情页
            const schoolParam = urlParams.get('school');
            if (schoolParam) {
                goToSchoolDetail(schoolParam);
            }
        });
    </script>
<script src="../ui-history-state.js"></script>
<script src="../mobile-function-shell.js" data-root=".."></script>
<script src="../navigation-history.js"></script>
</body>
</html>
