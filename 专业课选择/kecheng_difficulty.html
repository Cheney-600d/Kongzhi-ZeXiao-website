        }

        function renderTable() {
            const data = getFilteredData();
            const tbody = document.getElementById('table-body');
            const empty = document.getElementById('empty-state');
            const countLabel = document.getElementById('result-count');
            
            if (data.length === 0) {
                tbody.innerHTML = '';
                empty.classList.remove('hidden');
                countLabel.textContent = '显示 0 条数据';
            } else {
                empty.classList.add('hidden');
                tbody.innerHTML = data.map((r, i) => `
                    <tr class="table-row animate-fade-in" style="animation-delay: ${i * 0.03}s">
                        <td class="px-4 py-3 text-gray-500 font-medium">${r['序号']}</td>
                        <td class="px-4 py-3">
                            <a href="../index.html?school=${encodeURIComponent(r['学校'])}&from=${encodeURIComponent('专业课选择/kecheng_difficulty.html')}" class="school-name-flex font-medium text-gray-800 hover:text-indigo-600 hover:underline transition-colors" title="点击查看该校择校详情">
                                <img class="school-logo-sm" src="images/校徽/${r['学校']}.jpg" alt="" onerror="this.style.display='none'" loading="lazy">
                                ${r['学校']}
                            </a>
                            ${currentTab === 'all' ? `<div class="text-xs text-gray-400 mt-0.5">${r['_category']}</div>` : ''}
                        </td>
                        <td class="px-4 py-3 whitespace-nowrap">
                            <span class="px-2 py-1 rounded-lg text-xs font-medium whitespace-nowrap ${getSchoolClass(r['学校层次'])}">${r['学校层次']}</span>
                        </td>
                        <td class="px-4 py-3 text-center font-mono text-gray-700 font-medium">${r['专业课代码']}</td>
                        <td class="px-4 py-3 text-gray-700">${r['考试科目']}</td>
                        <td class="px-4 py-3 text-center whitespace-nowrap">
                            <span class="px-2 py-1 rounded-lg text-xs font-medium bg-gray-100 text-gray-600 whitespace-nowrap">${r['分数段']}</span>
                        </td>
                        <td class="px-4 py-3 text-center">
                            <span class="px-2 py-1 rounded-lg text-xs ${getDifficultyClass(r['难度梯度'])}">${r['难度梯度']}</span>
                        </td>
                        <td class="px-4 py-3 text-gray-500 text-xs">${r['备注']}</td>
                    </tr>
                `).join('');
                countLabel.textContent = `显示 ${data.length} 条数据`;
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('[id^="tab-"]').forEach(el => {
                el.classList.remove('tab-active');
                el.classList.add('tab-inactive', 'border', 'border-gray-200');
            });
            document.getElementById('tab-' + tab).classList.remove('tab-inactive', 'border', 'border-gray-200');
            document.getElementById('tab-' + tab).classList.add('tab-active');
            renderStats();
            renderTable();
        }

        function toggleFilter(type, value) {
            const set = activeFilters[type];
            if (set.has(value)) set.delete(value); else set.add(value);
            document.querySelectorAll(`[data-filter="${type}-${value}"]`).forEach(el => el.classList.toggle('active'));
            renderStats();
            renderTable();
        }

        function clearFilters() {
            activeFilters = { school: new Set(), diff: new Set() };
            document.querySelectorAll('.filter-chip').forEach(el => el.classList.remove('active'));
            document.getElementById('search-input').value = '';
            searchQuery = '';
            renderStats();
            renderTable();
        }

        function handleSearch() {
            searchQuery = document.getElementById('search-input').value;
            renderStats();
            renderTable();
        }

        renderStats();
        renderTable();
    </script>
<script src="../navigation-history.js"></script>
</body>
</html>
