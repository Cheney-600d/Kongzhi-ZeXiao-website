        function getDifficultyClass(diff) {
            if (diff === '难度较高') return 'difficulty-high';
            if (diff === '中等偏难') return 'difficulty-medhigh';
            if (diff === '中等难度') return 'difficulty-medium';
            if (diff === '中等偏易') return 'difficulty-medeasy';
            return 'difficulty-low';
        }

        function getSchoolClass(level) {
            if (level === '985高校') return 'school-985';
            if (level === '211高校') return 'school-211';
            if (level === '双一流高校') return 'school-double';
            return 'school-normal';
        }

        function getFilteredData() {
            let all = [];
            if (currentTab === 'all') {
                for (let key in DATA) {
                    all = all.concat(DATA[key].map(r => ({...r, _category: key})));
                }
            } else {
                all = (DATA[currentTab] || []).map(r => ({...r, _category: currentTab}));
            }
            
            if (activeFilters.school.size > 0) {
                all = all.filter(r => activeFilters.school.has(r['学校层次']));
            }
            if (activeFilters.diff.size > 0) {
                all = all.filter(r => activeFilters.diff.has(r['难度梯度']));
            }
            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                all = all.filter(r => {
                    return (r['学校'] || '').toLowerCase().includes(q) ||
                           (r['专业课代码'] || '').includes(q) ||
                           (r['考试科目'] || '').toLowerCase().includes(q) ||
                           (r['备注'] || '').toLowerCase().includes(q);
                });
            }
            return all;
        }

        function renderStats() {
            const container = document.getElementById('stats-container');
            if (currentTab === 'all') {
                container.innerHTML = STATS.map(s => `
                    <div class="stat-card glass-card rounded-2xl p-4 cursor-pointer" onclick="switchTab('${s.key}')">
                        <div class="flex items-center justify-between mb-2">
                            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-100 to-purple-100 flex items-center justify-center text-indigo-600">
                                <i class="fas ${s.icon}"></i>
                            </div>
                            <span class="text-xs text-gray-400">${s.count}所</span>
                        </div>
                        <div class="text-lg font-bold text-gray-800">${s.name}</div>
                        <div class="text-xs text-gray-500 mt-1">${s.desc}</div>
                        <div class="mt-2 text-xs text-indigo-600 font-medium">平均难度值 ${s.avg_diff}</div>
                    </div>
                `).join('');
            } else {
                const s = STATS.find(x => x.key === currentTab);
                const allDiffs = getFilteredData().map(r => r['难度梯度']);
                const diffCounts = {};
                allDiffs.forEach(d => diffCounts[d] = (diffCounts[d] || 0) + 1);
                container.innerHTML = `
                    <div class="stat-card glass-card rounded-2xl p-4">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white text-lg">
                                <i class="fas ${s.icon}"></i>
                            </div>
                            <div>
                                <div class="text-2xl font-bold text-gray-800">${s.name}</div>
                                <div class="text-xs text-gray-500">${s.desc}</div>
                            </div>
                        </div>
                    </div>
                    <div class="stat-card glass-card rounded-2xl p-4">
                        <div class="text-xs text-gray-500 mb-1">当前显示</div>
                        <div class="text-2xl font-bold text-indigo-600">${getFilteredData().length}<span class="text-sm text-gray-400 font-normal"> / ${s.count}</span></div>
                    </div>
                    <div class="stat-card glass-card rounded-2xl p-4">
                        <div class="text-xs text-gray-500 mb-1">平均难度值</div>
                        <div class="text-2xl font-bold text-orange-500">${s.avg_diff}</div>
                    </div>
                    <div class="stat-card glass-card rounded-2xl p-4">
                        <div class="text-xs text-gray-500 mb-1">难度分布</div>
                        <div class="flex flex-wrap gap-1 mt-1">
                            ${Object.entries(diffCounts).map(([d, c]) => `<span class="px-2 py-0.5 rounded text-xs ${getDifficultyClass(d)}">${d} ${c}</span>`).join('')}
                        </div>
                    </div>
                `;
            }
        }

        function renderTable() {
            const data = getFilteredData();
            const tbody = document.getElementById('table-body');
            const empty = document.getElementById('empty-state');
            const countLabel = document.getElementById('result-count');
            
            if (data.length === 0) {
                tbody.innerHTML = '';
                empty.classList.remove('hidden');
                countLabel.textContent = '显示 0 条数据';
            } else {
                empty.classList.add('hidden');
                tbody.innerHTML = data.map((r, i) => `
                    <tr class="table-row animate-fade-in" style="animation-delay: ${i * 0.03}s">
                        <td class="px-4 py-3 text-gray-500 font-medium">${r['序号']}</td>
                        <td class="px-4 py-3">
                            <a href="../index.html?school=${encodeURIComponent(r['学校'])}&from=${encodeURIComponent('专业课选择/kecheng_difficulty.html')}" class="school-name-flex font-medium text-gray-800 hover:text-indigo-600 hover:underline transition-colors" title="点击查看该校择校详情">
                                <img class="school-logo-sm" src="images/校徽/${r['学校']}.jpg" alt="" onerror="this.style.display='none'" loading="lazy">
                                ${r['学校']}
                            </a>
                            ${currentTab === 'all' ? `<div class="text-xs text-gray-400 mt-0.5">${r['_category']}</div>` : ''}
                        </td>
                        <td class="px-4 py-3 whitespace-nowrap">
                            <span class="px-2 py-1 rounded-lg text-xs font-medium whitespace-nowrap ${getSchoolClass(r['学校层次'])}">${r['学校层次']}</span>
                        </td>
                        <td class="px-4 py-3 text-center font-mono text-gray-700 font-medium">${r['专业课代码']}</td>
                        <td class="px-4 py-3 text-gray-700">${r['考试科目']}</td>
                        <td class="px-4 py-3 text-center whitespace-nowrap">
                            <span class="px-2 py-1 rounded-lg text-xs font-medium bg-gray-100 text-gray-600 whitespace-nowrap">${r['分数段']}</span>
                        </td>
                        <td class="px-4 py-3 text-center">
                            <span class="px-2 py-1 rounded-lg text-xs ${getDifficultyClass(r['难度梯度'])}">${r['难度梯度']}</span>
                        </td>
                        <td class="px-4 py-3 text-gray-500 text-xs">${r['备注']}</td>
                    </tr>
                `).join('');
                countLabel.textContent = `显示 ${data.length} 条数据`;
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('[id^="tab-"]').forEach(el => {
                el.classList.remove('tab-active');
                el.classList.add('tab-inactive', 'border', 'border-gray-200');
            });
            document.getElementById('tab-' + tab).classList.remove('tab-inactive', 'border', 'border-gray-200');
            document.getElementById('tab-' + tab).classList.add('tab-active');
            renderStats();
            renderTable();
        }

        function toggleFilter(type, value) {
            const set = activeFilters[type];
            if (set.has(value)) set.delete(value); else set.add(value);
            document.querySelectorAll(`[data-filter="${type}-${value}"]`).forEach(el => el.classList.toggle('active'));
            renderStats();
            renderTable();
        }

        function clearFilters() {
            activeFilters = { school: new Set(), diff: new Set() };
            document.querySelectorAll('.filter-chip').forEach(el => el.classList.remove('active'));
            document.getElementById('search-input').value = '';
            searchQuery = '';
            renderStats();
            renderTable();
        }

        function handleSearch() {
            searchQuery = document.getElementById('search-input').value;
            renderStats();
            renderTable();
        }

        renderStats();
        renderTable();
    </script>
</body>
</html>
