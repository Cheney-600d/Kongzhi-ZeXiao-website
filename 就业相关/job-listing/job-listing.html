  <script>
    // Sticky filter-bar polyfill: pin to top on scroll
    (function () {
      var filterBar = document.querySelector('.filter-bar');
      var header = document.querySelector('header.hero');
      var placeholder = null;

      function onScroll() {
        if (!filterBar || !header) return;
        var headerBottom = header.getBoundingClientRect().bottom;

        if (headerBottom <= 0 && !filterBar.classList.contains('is-pinned')) {
          // Measure before pinning to avoid layout shift
          var height = filterBar.offsetHeight;
          var marginBottom = window.getComputedStyle(filterBar).marginBottom;
          filterBar.classList.add('is-pinned');
          // Insert placeholder so content below doesn't jump up
          placeholder = document.createElement('div');
          placeholder.style.height = height + 'px';
          placeholder.style.marginBottom = marginBottom;
          placeholder.style.pointerEvents = 'none';
          filterBar.parentNode.insertBefore(placeholder, filterBar.nextSibling);
        } else if (headerBottom > 0 && filterBar.classList.contains('is-pinned')) {
          filterBar.classList.remove('is-pinned');
          if (placeholder) { placeholder.remove(); placeholder = null; }
        }
      }

      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', onScroll);
      onScroll();
    })();
  </script>
