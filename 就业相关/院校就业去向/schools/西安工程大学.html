    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; background: #f5f7fa; color: #2d3436; line-height: 1.7; }
        .header { background: linear-gradient(135deg, #A8E6CF 0%, #B8E6D8 100%); color: #1a1a2e; padding: 30px 20px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .header h1 { font-size: 2em; margin-bottom: 10px; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); }
        .badge { display: inline-block; padding: 6px 16px; background: rgba(255,255,255,0.25); color: #1a1a2e; border-radius: 20px; font-size: 0.85em; font-weight: bold; border: 1px solid rgba(255,255,255,0.3); }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .back-link { display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; background: white; border: 1px solid #e8e8e8; border-radius: 8px; text-decoration: none; color: #2d3436; font-size: 1em; transition: all 0.3s; margin-bottom: 20px; }
        .back-link:hover { background: #F8FAFC; border-color: #A8E6CF; color: #A8E6CF; }
        .section { background: white; border-radius: 16px; padding: 24px; margin-bottom: 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
        .section h2 { font-size: 1.3em; margin-bottom: 16px; color: #A8E6CF; padding-bottom: 10px; border-bottom: 2px solid #F8C3CD; }
        .section h3 { font-size: 1.15em; margin: 16px 0 10px; color: #444; }
        .pdf-page { margin-bottom: 20px; }
        .page-label { font-size: 0.85em; color: #7a7a7a; margin-bottom: 8px; text-align: center; }
        .pdf-page img { width: 100%; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .image-cropper { width: 100%; overflow: hidden; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .image-cropper img { width: 100%; display: block; }
        .crop-top img { clip-path: inset(0 0 50% 0); }
        .crop-bottom img { clip-path: inset(50% 0 0 0); }
        .info-list { list-style: none; padding: 0; }
        .info-list li { padding: 10px 14px; background: #F8C3CD; border-radius: 8px; margin-bottom: 8px; font-size: 1em; }
        .info-note { padding: 14px; background: #fff8e1; border-left: 4px solid #ffc107; border-radius: 8px; font-size: 0.9em; color: #5a5a5a; }
        footer { text-align: center; padding: 30px 20px; color: #8a8a8a; font-size: 0.85em; }
        @media (max-width: 768px) { .header h1 { font-size: 1.4em; } .section { padding: 16px; } }
    </style>

<style>html{zoom:0.85;}@media(max-width:768px){html{zoom:0.9;}}</style>
