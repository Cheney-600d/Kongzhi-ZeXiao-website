<!DOCTYPE html>

    <style>

        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; background: #F8FAFC; color: #2d3436; line-height: 1.7; }
        .header { background: linear-gradient(135deg, #B8A4D8 0%, #D8C0E8 100%); color: #1a1a2e; padding: 40px 20px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .header h1 { font-size: 2.2em; margin-bottom: 10px; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); }
        .badge { display: inline-block; padding: 6px 16px; background: rgba(255,255,255,0.25); color: #1a1a2e; border-radius: 20px; font-size: 0.85em; font-weight: bold; border: 1px solid rgba(255,255,255,0.3); }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .back-link { display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; background: white; border: 1px solid #e8e8e8; border-radius: 8px; text-decoration: none; color: #2d3436; font-size: 1em; transition: all 0.3s; margin-bottom: 20px; }
        .back-link:hover { background: #F8FAFC; border-color: #B8A4D8; color: #B8A4D8; }
        .section { background: white; border-radius: 16px; padding: 24px; margin-bottom: 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
        .section h2 { font-size: 1.3em; margin-bottom: 16px; color: #B8A4D8; padding-bottom: 10px; border-bottom: 2px solid #F5F0F7; }
        .info-note { padding: 20px; background: #fff8e1; border-left: 4px solid #ffc107; border-radius: 8px; font-size: 0.95em; color: #5a5a5a; text-align: center; }
        .footer { text-align: center; padding: 30px 20px; color: #8a8a8a; font-size: 0.85em; }
        @media (max-width: 768px) { .header h1 { font-size: 1.5em; } .section { padding: 16px; } }
    </style>
</head>

    <div class="header">

    <div class="container">
