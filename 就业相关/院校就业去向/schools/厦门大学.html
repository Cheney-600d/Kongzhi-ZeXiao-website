<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>厦门大学 - 控制类硕士就业去向</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #E1F5FE;
            color: #2d3436;
            line-height: 1.7;
        }
        
        .header {
            text-shadow: 0 1px 2px rgba(255,255,255,0.5);
            background: linear-gradient(135deg, #B8E6D8 0%, #D4F1E0 100%);
            color: #1a1a2e;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        
        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 14px;
            background: rgba(255,255,255,0.25);
            border-radius: 20px;
            font-size: 0.85em;
            margin: 0 4px;
            backdrop-filter: blur(4px);
        }
        
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: white;
            border: 2px solid #B8E6D8;
            border-radius: 25px;
            cursor: pointer;
            margin: 20px;
            font-size: 1em;
            text-decoration: none;
            transition: all 0.3s;
            font-weight: 500;
        }
        
        .back-btn:hover {
            background: #B8E6D8;
            color: #1a1a2e;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px 40px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            border-left: 4px solid #B8E6D8;
        }
        
        .stat-value {
            font-size: 1.4em;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 4px;
        }
        
        .stat-label {
            color: #7a7a7a;
            font-size: 0.85em;
        }
        
        .section {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        
        .section h2 {
            font-size: 1.2em;
            margin-bottom: 16px;
            color: #1a1a2e;
            padding-bottom: 10px;
            border-bottom: 2px solid #B3E5FC;
        }
        
        .offers-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .offers-table th {
            text-align: left;
            padding: 12px;
            background: #B3E5FC;
            color: #1a1a2e;
            font-weight: 600;
            font-size: 0.9em;
        }
        
        .offers-table td {
            padding: 12px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 0.9em;
        }
        
        .offers-table tr:hover {
            background: #E1F5FE;
        }
        
        .company-name {
            font-weight: 600;
            color: #1a1a1a;
            white-space: nowrap;
        }
        
        .company-detail {
            color: #5a5a5a;
        }
        
        .pdf-section {
            text-align: center;
        }
        
        .pdf-image {
            max-width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
            margin-bottom: 16px;
        }
        
        .tag {
            display: inline-block;
            padding: 3px 10px;
            background: #B3E5FC;
            color: #B8E6D8;
            border-radius: 12px;
            font-size: 0.8em;
            margin: 0 4px 4px 0;
        }
        
        footer {
            text-align: center;
            padding: 30px;
            color: #8a8a8a;
            font-size: 0.85em;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.4em;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .offers-table th,
            .offers-table td {
                padding: 8px;
                font-size: 0.85em;
            }
            
            .company-name {
                white-space: normal;
            }
        }
    
        .chart-container { background: white; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); padding: 16px; margin-bottom: 20px; }
    </style>
    <script src="../../../vendor/echarts.min.js"></script>

<style>html{zoom:0.85;}@media(max-width:768px){html{zoom:0.9;}}</style>
</head>
<body>
    <div class="header">
        <h1>厦门大学</h1>
        <div>
            <span class="badge">985</span>
            <span class="tag">985</span>
        </div>
    </div>
    
    <a href="javascript:history.back()" class="back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        返回上一级
    </a>
    
    <div class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value">22-32万</div>
                <div class="stat-label">平均薪资</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">华为、腾讯、美图</div>
                <div class="stat-label">主要雇主</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">98%</div>
                <div class="stat-label">就业率</div>
            </div>
        </div>
        
        <div class="section">
            <h2>📋 就业去向详情</h2>
            <table class="offers-table">
                <thead>
                    <tr>
                        <th style="width: 30%">就业单位</th>
                        <th>薪资/岗位详情</th>
                    </tr>
                </thead>
                <tbody>
                    
                <tr>
                    <td class="company-name">华为</td>
                    <td class="company-detail">主要就业单位</td>
                </tr>
            
                <tr>
                    <td class="company-name">腾讯</td>
                    <td class="company-detail">主要就业单位</td>
                </tr>
            
                <tr>
                    <td class="company-name">美图</td>
                    <td class="company-detail">主要就业单位</td>
                </tr>
            
                </tbody>
            </table>
        </div>
        
        </div>
    
    <div class="info-card full-width">
<h3>📊 就业数据洞察（2026/6/21更新）</h3>
<p style="margin-bottom:16px;color:#555;">以下数据已可视化展示，交互图表可查看详细数据。</p>

    <script>

        var option1 = {

        };
        chart1.setOption(option1);
    })();</script>
    <footer>
        <p>数据来源：《控制类硕士就业去向》PDF | 制作：@一只通信考研的er</p>
        <p>仅供参考，数据可能存在时效性差异</p>
    </footer>
</body>
</html>
