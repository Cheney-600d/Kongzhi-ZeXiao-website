        }

            width: 100%;

            border: none;
            border-radius: 50px;
            font-size: 1rem;

        }

            color: #8a8a8a;
        }

            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

            padding: 8px 20px;
            background: rgba(255,255,255,0.2);
            color: #1a1a2e;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        
        .filter-tab:hover, .filter-tab.active {
            background: white;
            color: #1a1a2e;
        }
        
        .schools-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .reviewed-dot {
            position: absolute;
            bottom: 12px;
            left: 12px;
            width: 10px;
            height: 10px;
            background: #FFAB91;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(255, 171, 145, 0.5);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 171, 145, 0.5); }
            70% { box-shadow: 0 0 0 6px rgba(255, 171, 145, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 171, 145, 0); }
        }
        
        .school-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
            position: relative;
        }
        
        .school-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }
        
        .school-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 10px;

            color: #1a1a2e;
        }

            background: #E8F5E9;
            color: #1a1a2e;
        }

            color: #1a1a2e;
        }

        }

            color: #2d3436;
            margin-bottom: 8px;
        }
        
        .school-info {
            font-size: 0.85rem;
            color: #5a5a5a;
            line-height: 1.5;
        }

            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.1rem;
            font-weight: bold;
            color: #1a1a2e;
        }
        
        .stat-label {
            font-size: 0.75rem;
            color: #8a8a8a;

            { name: "河北大学", category: "other", badge: "其他", page: 85, info: "22届电子与通信工程 | 移动河北3人/新风航天/小米/奕斯伟 | 京津冀为主", reviewed: true },
            { name: "华南农业大学", category: "other", badge: "其他", page: 85, info: "省内就业85.35% | 硕士企业63.56%/国家机关11.70% | 博士高校+科研", reviewed: true },
            { name: "西安工程大学", category: "other", badge: "其他", page: 86, info: "特色高校" }
        ];
        
        // 生成学校卡片
        function generateSchoolCards(schools) {
            const grid = document.getElementById('schoolsGrid');
            grid.innerHTML = '';
            
            schools.forEach(school => {
                const card = document.createElement('a');
                card.className = 'school-card';
                card.href = `schools/${school.name.replace(/[\/\\]/g, '_')}.html`;
                
                const badgeClass = {
                    '985': 'badge-985',
                    '211': 'badge-211',
                    '国防七子': 'badge-defense',
                    '四电四邮': 'badge-4e4y',
                    '其他': 'badge-other',
                    '科研院所': 'badge-other'
                }[school.badge] || 'badge-other';
                
                card.innerHTML = `
                    <span class="school-badge ${badgeClass}">${school.badge}</span>
                    <div class="school-name">${school.name}</div>
                    <div class="school-info">${school.info}</div>
                    <div class="stats-bar">
                        <div class="stat-item">
                            <div class="stat-value">查看</div>
                            <div class="stat-label">详细数据</div>
                        </div>
                    </div>
                    ${school.reviewed ? '<div class="reviewed-dot" title="已审核"></div>' : ''}
                `;
                
                grid.appendChild(card);
            });
        }
        
        // 搜索过滤
        function filterSchools() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const activeCategory = document.querySelector('.filter-tab.active').textContent;
            
            let filtered = schoolsData;
            
            // 按类别过滤
            if (activeCategory !== '全部') {
                const categoryMap = {
                    '985高校': '985',
                    '211高校': '211',
                    '国防七子': 'defense',
                    '四电四邮': '4e4y',
                    '其他高校': 'other'
                };
                filtered = filtered.filter(s => s.category === categoryMap[activeCategory]);
            }
            
            // 按搜索词过滤
            if (searchTerm) {
                filtered = filtered.filter(s => s.name.toLowerCase().includes(searchTerm));
            }
            
            generateSchoolCards(filtered);
            
            // 显示/隐藏无结果提示
            document.getElementById('noResults').style.display = filtered.length === 0 ? 'block' : 'none';
        }
        
        // 按类别过滤
        function filterByCategory(category) {
            // 更新标签状态
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            
            filterSchools();
        }
        
        // 初始化
        generateSchoolCards(schoolsData);
    </script>
</body>
