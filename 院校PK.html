(function(){
  const key = 'navHistory';

    const saved = sessionStorage.getItem(key);

  const current = location.href;
  if(history.length === 0 || history[history.length-1] !== current){
    history.push(current);
    sessionStorage.setItem(key, JSON.stringify(history));
  }
  window.goBack = function(){
    if(history.length <= 1) return;
    history.pop();
    const prev = history[history.length-1];
    if(prev){ sessionStorage.setItem(key, JSON.stringify(history)); location.href = prev; }
  };
  window.hasBack = function(){ return history.length > 1; };
})();
</script>

function getEvalClass(tag){
  if(tag.includes('A+')) return 'eval-a-plus';
  if(tag.includes('A-')) return 'eval-a-minus';
  if(tag.includes('A')) return 'eval-a';
  if(tag.includes('B+')) return 'eval-b-plus';

}

// ===================== 状态管理 =====================
let selectedSchools = [];
const PK_COLORS = ['#a92122','#E57373','#66BB6A','#F9A825','#64B5F6','#FF8A65','#BA68C8','#4DB6AC','#FFB74D','#7986CB'];
const MAX_SCHOOLS = 10;

// ===================== 搜索功能 =====================
function onPkSearch(val){
  const dd = document.getElementById('pkDropdown');
  if(!val){ dd.classList.remove('active'); return; }
  const matches = ALL_SCHOOLS.filter(s=>s.includes(val)&&!selectedSchools.includes(s)).slice(0,10);
  if(matches.length===0){ dd.classList.remove('active'); return; }
  dd.innerHTML = matches.map(s=>`<div onclick="addSchool('${s.replace(/'/g,"\\'")}')">${s}</div>`).join('');
  dd.classList.add('active');
}

function onPkEnter(){
  const dd = document.getElementById('pkDropdown');
  const first = dd.querySelector('div');
  if(first){
    first.click();
  }
}

function addSchool(name){
  if(selectedSchools.length>=MAX_SCHOOLS) return;
  if(selectedSchools.includes(name)) return;
  selectedSchools.push(name);
  localStorage.setItem('pkSelectedSchools', JSON.stringify(selectedSchools));
  document.getElementById('pkSearch').value='';
  document.getElementById('pkDropdown').classList.remove('active');
  updateSelected();
  renderPk();
}

function removeSchool(name){
  selectedSchools = selectedSchools.filter(s=>s!==name);
  localStorage.setItem('pkSelectedSchools', JSON.stringify(selectedSchools));
  updateSelected();
  renderPk();
}

function resetPk(){
  selectedSchools = [];
  localStorage.removeItem('pkSelectedSchools');
  document.getElementById('pkSearch').value='';
  updateSelected();
  renderPk();
}

function updateSelected(){
  const el = document.getElementById('pkSelected');
  document.getElementById('pkCount').textContent = selectedSchools.length;
  const n = selectedSchools.length;
  
  // 获取每行分布，避免最后一行只有1个
  function getDistribution(n) {
    if (n <= 4) return [n];
    if (n === 5) return [3, 2];
    if (n === 6) return [3, 3];
    if (n === 7) return [4, 3];
    if (n === 8) return [4, 4];
    if (n === 9) return [3, 3, 3];
    if (n === 10) return [4, 3, 3];
    return [4, 4, 4];
  }
  
  const dist = getDistribution(n);
  const maxCols = Math.max(...dist);
  
  // 字号大幅放大，让字体充满标签85%空间
  const fs = maxCols === 1 ? 66 : maxCols === 2 ? 56 : maxCols === 3 ? 50 : 44;
  const vsFs = Math.max(28, fs - 12);
  // 高度放大，让标签更饱满舒适
  const padV = 14;
  const padH = 16;
  
  function hexToRgba(hex, a) {
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }
  
  // 外层容器：宽度100%，每行垂直排列，间距20px
  let html = '<div style="width:100%;display:flex;flex-direction:column;gap:20px;">';
  let idx = 0;
  
  dist.forEach(count => {
    html += '<div style="display:flex;width:100%;justify-content:center;align-items:center;gap:16px;">';
    for (let i = 0; i < count; i++) {
      const s = selectedSchools[idx];
      const c = PK_COLORS[idx % PK_COLORS.length];
      const glow = hexToRgba(c, 0.85);
      const glow2 = hexToRgba(c, 0.5);
      // 白色文字 + 黑色粗描边，类似图片中的圆润卡牌风格
      const textShadow = '0 1px 3px rgba(0,0,0,0.3)';
      html += '<span class="school-tag" style="background:linear-gradient(135deg,'+c+' 0%,'+c+' 100%);justify-content:center;font-size:'+fs+'px;font-weight:900;letter-spacing:1px;padding:'+padV+'px '+padH+'px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#FFFFFF;text-shadow:'+textShadow+';border-radius:32px;">'
        + '<span style="cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" onclick="window.open(\'index.html?school='+encodeURIComponent(s)+'&from=院校PK.html\',\'_blank\')" title="查看'+s+'详情">'+wrapSchoolBadge(s)+'</span>'
        + '<span class="del" style="flex-shrink:0;width:32px;height:32px;font-size:18px;margin-left:8px;color:#FFFFFF;text-shadow:'+textShadow+';" onclick="removeSchool(\''+s.replace(/'/g, "\\'")+'\')">×</span>'
        + '</span>';
      idx++;
      if (i < count - 1) {
        html += '<span style="font-size:'+vsFs+'px;font-weight:900;color:#17191d;text-shadow:0 0 4px rgba(169,33,34,0.3);flex-shrink:0;letter-spacing:1px;">VS</span>';
      }
    }
    html += '</div>';
  });
  
  html += '</div>';
  el.innerHTML = html;
}

// ===================== 渲染对比内容 =====================
function renderPk(){
  const container = document.getElementById('pkContent');
  if(selectedSchools.length<2){
    container.innerHTML = '<div class="empty-tip">请至少选择2所院校进行对比</div>';
    return;
  }

  const schools = selectedSchools;
  const stats = schools.map(s=>SCHOOL_STATS_MAP[s]||{});
  const recs = schools.map(s=>records.filter(r=>r.school===s));

  // 计算各院校汇总数据
  const summaries = schools.map((s,i)=>{
    const r = recs[i];
    const st = stats[i];
    const totalEnter = r.reduce((sum,x)=>sum+(x.enterNum||0),0);
    const totalAdmit = r.reduce((sum,x)=>sum+(x.admitNum||0),0);
    // 平均分只在有数据的记录上统计，缺失(null/0)记录不参与，避免被拉低
    const withAdmit = r.filter(x=>x.admitAvg>0);
    const avgAdmit = withAdmit.length ? withAdmit.reduce((s,x)=>s+x.admitAvg,0)/withAdmit.length : 0;
    const withCourse = r.filter(x=>x.courseAvg>0);
    const avgCourse = withCourse.length ? withCourse.reduce((s,x)=>s+x.courseAvg,0)/withCourse.length : 0;
    const ratio = totalAdmit ? (totalEnter/totalAdmit).toFixed(2) : '-';
    const colleges = [...new Set(r.map(x=>x.college))];
    const majors = [...new Set(r.map(x=>x.majorCode))];
    const tags = getSchoolTags(s);
    return {school:s, tier:st.tier||'双非', province:st['省份/自治区']||'-', collegeCount:colleges.length, majorCount:majors.length, totalEnter, totalAdmit, ratio, avgAdmit, avgCourse, tags, colleges, recs:r};
  });

  // 颜色分配（10个马卡龙色系，循环使用）
  const colors = PK_COLORS;

  let html = '';

  // ===== 基本信息对比 =====
  html += `<div class="card p-4 mb-6"><h3 class="pk-section-title">基本信息</h3>`;
  html += `<div style="overflow-x:auto;"><table class="compare-table" style="--cols:${schools.length};"><thead><tr><th class="label-col">对比项</th>${schools.map((s,i)=>`<th class="school-col" style="color:#fff;">${wrapSchoolBadge(s)}</th>`).join('')}</tr></thead><tbody>`;
  
  // 层级
  const tierClassMap = {'985':'tier-985','211':'tier-211','双非':'tier-sf'};
  html += `<tr><td class="label-col">层级</td>${summaries.map(s=>`<td><span class="${tierClassMap[s.tier]||'tier-sf'}">${s.tier}</span></td>`).join('')}</tr>`;
  
  // 省份
  html += `<tr><td class="label-col">省份</td>${summaries.map(s=>`<td>${s.province}</td>`).join('')}</tr>`;
  
  // 学科评估（控制评级，对齐就业卡片）
  html += `<tr><td class="label-col">控制科学与工程</td>${summaries.map(s=>{
    const tag = s.tags.find(t=>t.includes('控制'));
    return `<td>${tag?`<span class="${getEvalClass(tag)}" style="cursor:pointer;" title="官方学科评估评级（第四轮）">${tag.replace('控制','')}</span>`:'/'}</td>`;
  }).join('')}</tr>`;
  
  html += `</tbody></table></div></div>`;

  // ===== 招生规模对比 =====
  html += `<div class="card p-4 mb-6"><h3 class="pk-section-title">招生规模</h3>`;
  html += `<div style="overflow-x:auto;"><table class="compare-table" style="--cols:${schools.length};"><thead><tr><th class="label-col">对比项</th>${schools.map((s,i)=>`<th class="school-col" style="color:#fff;">${wrapSchoolBadge(s)}</th>`).join('')}</tr></thead><tbody>`;
  html += `<tr><td class="label-col">学院数</td>${summaries.map(s=>`<td>${s.collegeCount}</td>`).join('')}</tr>`;
  html += `<tr><td class="label-col">专业方向数</td>${summaries.map(s=>`<td>${s.majorCount}</td>`).join('')}</tr>`;
  html += `<tr><td class="label-col">总进复试人数</td>${summaries.map(s=>`<td>${s.totalEnter}</td>`).join('')}</tr>`;
  html += `<tr><td class="label-col">总拟录取人数</td>${summaries.map(s=>`<td>${s.totalAdmit}</td>`).join('')}</tr>`;
  html += `</tbody></table></div></div>`;

  // ===== 竞争难度对比 =====
  html += `<div class="card p-4 mb-6"><h3 class="pk-section-title">竞争难度</h3>`;
  html += `<div style="overflow-x:auto;"><table class="compare-table" style="--cols:${schools.length};"><thead><tr><th class="label-col">对比项</th>${schools.map((s,i)=>`<th class="school-col" style="color:#fff;">${wrapSchoolBadge(s)}</th>`).join('')}</tr></thead><tbody>`;
  
  function ratioClass(r){ if(!r||r==='-') return ''; const v=parseFloat(r); if(v>1.5) return 'ratio-high'; if(v>1.3) return 'ratio-mid'; return 'ratio-low'; }
  function scoreClass(s){ if(!s) return ''; if(s>=380) return 'score-high'; if(s>=350) return 'score-mid'; return 'score-low'; }
  
  html += `<tr><td class="label-col">平均复录比</td>${summaries.map(s=>`<td class="${ratioClass(s.ratio)}">${s.ratio}</td>`).join('')}</tr>`;
  html += `<tr><td class="label-col">平均录取分</td>${summaries.map(s=>`<td class="${scoreClass(s.avgAdmit)}">${s.avgAdmit?s.avgAdmit.toFixed(1):'-'}</td>`).join('')}</tr>`;
  html += `<tr><td class="label-col">平均专业课分</td>${summaries.map(s=>`<td class="${scoreClass(s.avgCourse)}">${s.avgCourse?s.avgCourse.toFixed(1):'-'}</td>`).join('')}</tr>`;
  html += `</tbody></table></div></div>`;

  // ===== 就业对比 =====
  html += `<div class="card p-4 mb-6"><h3 class="pk-section-title">就业对比</h3>`;
  html += `<div style="overflow-x:auto;"><table class="compare-table" style="--cols:${schools.length};"><thead><tr><th class="label-col">对比项</th>${schools.map((s,i)=>`<th class="school-col" style="color:#fff;">${wrapSchoolBadge(s)}</th>`).join('')}</tr></thead><tbody>`;
  
  // 就业数据链接
  html += `<tr><td class="label-col">就业数据</td>${schools.map(s=>{
    const hasData = EMPLOYMENT_SCHOOLS.has(s);
    const mappedPath = EMPLOYMENT_MAP[s];
    if (hasData || mappedPath) {
      const path = mappedPath || '就业相关/院校就业去向/schools/' + s + '.html';
      return `<td><a href="${path}" style="display:inline-block;padding:4px 12px;background:#deded8;color:#a92122;border-radius:6px;font-size:13px;text-decoration:none;font-weight:700;" title="查看就业详情">📊 查看就业</a></td>`;
    } else {
      return `<td><span style="display:inline-block;padding:4px 12px;background:#f8f8f6;color:#9B8AA5;border-radius:6px;font-size:13px;font-weight:600;">敬请期待</span></td>`;
    }
  }).join('')}</tr>`;
  
  // 就业概况（详情页有真实数据→宝典简介+TOP5；详情页未整理→如实标数据整理中，不展示旧通信期内容）
  html += `<tr><td class="label-col">就业概况</td>${schools.map(s=>{
    const bd = getBaodianEmployment(s);
    if (bd && bd.intro) {
      const intro = bd.intro.length > 46 ? bd.intro.slice(0,46) + '…' : bd.intro;
      const top5 = bd.top5.length ? `<div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:4px;justify-content:center;">` + bd.top5.map((t,i)=>`<span style="display:inline-block;padding:2px 8px;background:linear-gradient(135deg,#deded8 0%,#d5d5cf 100%);color:#4a4a5a;border-radius:12px;font-size:12px;font-weight:600;">${i+1}.${t}</span>`).join('') + `</div>` : '';
      return `<td style="font-size:13px;color:#555;text-align:left;padding:10px 12px;line-height:1.7;">${intro}${top5}</td>`;
    } else {
      // 无宝典简介时：详情页为占位（数据整理中）则如实标注，暂无页面则敬请期待（就业数据行仍有查看就业链接）
      const hasPage = EMPLOYMENT_SCHOOLS.has(s) || EMPLOYMENT_MAP[s];
      const label = hasPage ? '数据整理中' : '敬请期待';
      return `<td><span style="display:inline-block;padding:4px 12px;background:#f8f8f6;color:#9B8AA5;border-radius:6px;font-size:13px;font-weight:600;">${label}</span></td>`;
    }
  }).join('')}</tr>`;
  
  html += `</tbody></table></div></div>`;

  // ===== 专业课考察对比 =====
  html += `<div class="card p-4 mb-6"><h3 class="pk-section-title">专业课考察</h3>`;

  // 从 records 中提取对比学校的专业课（纯名称 + 代码）
  function extractCourseName(course2){
    if(!course2) return '';
    // 主站 course2 为「代码+名称」格式（如 816自动控制理论），剥掉前置代码前缀
    return course2.replace(/^\(\d+\)/, '').replace(/^\d{1,3}\s*/, '').replace(/（.*?）/g, '').trim();
  }
  function extractCourseCode(course2){
    if(!course2) return '';
    const match = course2.match(/^\(?(\d{1,3})\)?/);
    return match ? match[1] : '';
  }

  const hasCourseData = schools.some(s=>records.some(r=>r.school===s && extractCourseName(r.course2)));
  if(hasCourseData){
    // 每个学校一行：先显示学校，再显示它考察的专业课（科目 + 代码 + 加权均分）
    html += `<div style="overflow-x:auto;"><table class="compare-table" style="--cols:1;"><thead><tr><th class="label-col">学校</th><th style="color:#fff;">考察专业课（代码）</th></tr></thead><tbody>`;
    schools.forEach(s=>{
      // 按专业课科目归组（同科目多学院记录合并展示）
      const bySubject = {};
      records.filter(r=>r.school===s).forEach(r=>{
        const name = extractCourseName(r.course2);
        if(name){
          if(!bySubject[name]) bySubject[name] = [];
          bySubject[name].push(r);
        }
      });
      const chips = Object.entries(bySubject).sort((a,b)=>a[0].localeCompare(b[0],'zh')).map(([subject, recs])=>{
        // 提取代码（去重，多代码用 / 分隔）
        const codes = [...new Set(recs.map(r=>extractCourseCode(r.course2)).filter(Boolean))];
        const codeText = codes.length ? codes.join('/') : '请见择校宝典';
        // 加权平均分（按拟录取人数加权）
        let totalAdmit = 0, weightedSum = 0;
        recs.forEach(r=>{
          const admit = r.admitNum || 0, avg = r.courseAvg || 0;
          if(admit > 0 && avg > 0){ totalAdmit += admit; weightedSum += avg * admit; }
        });
        const weightedAvg = totalAdmit > 0 ? (weightedSum / totalAdmit).toFixed(1) : null;
        const avgText = weightedAvg ? ` <span style="color:#9a8aa0;font-size:12px;">(${weightedAvg})</span>` : '';
        return `<span style="display:inline-block;padding:4px 12px;background:#f8f8f6;border-radius:8px;margin:2px 6px 2px 0;font-size:13px;color:#4a4a5a;">${subject} <span style="color:#8b5cf6;font-weight:700;">${codeText}</span>${avgText}</span>`;
      });
      html += `<tr><td class="label-col">${wrapSchoolBadge(s)}</td><td style="text-align:left;font-size:13px;line-height:2;">${chips.length ? chips.join('') : '<span style="color:#9b8aa5;">-</span>'}</td></tr>`;
    });
    html += `</tbody></table></div>`;
  }
  html += `</div>`;

  // ===== 各学院招生详情 =====
  html += `<div class="card p-4 mb-6"><h3 class="pk-section-title">各学院招生详情</h3>`;
  
  // 使用网格分列展示，每列一个学校
  html += `<div style="display:grid;grid-template-columns:repeat(${schools.length},1fr);gap:16px;align-items:start;">`;
  
  schools.forEach((s,i)=>{
    const schoolRecs = summaries[i].recs;
    const collegeGroups = {};
    schoolRecs.forEach(r=>{
      const c = r.college || '未知学院';
      if(!collegeGroups[c]) collegeGroups[c] = [];
      collegeGroups[c].push(r);
    });
    
    html += `<div style="background:#f8fafc;border-radius:10px;border-top:4px solid ${colors[i]};padding:12px;">`;
    html += `<div style="font-size:1.05rem;font-weight:700;color:${colors[i]};text-align:center;margin-bottom:10px;padding-bottom:8px;border-bottom:1px dashed #6a6a7a;">${wrapSchoolBadge(s)}</div>`;
    
    Object.entries(collegeGroups).forEach(([college, recs])=>{
      const enter = recs.reduce((sum,r)=>sum+(r.enterNum||0),0);
      const admit = recs.reduce((sum,r)=>sum+(r.admitNum||0),0);
      const ratio = admit?(enter/admit).toFixed(2):'-';
      const withAdmit = recs.filter(r=>r.admitAvg>0);
      const avgAdmit = withAdmit.length?withAdmit.reduce((s,r)=>s+r.admitAvg,0)/withAdmit.length:0;
      const foldId = `fold-${s}-${college}`.replace(/[^a-zA-Z0-9]/g,'-');
      
      html += `<div style="margin-bottom:10px;padding:8px 10px;background:#FFFFFF;border-radius:6px;border-left:3px solid ${colors[i]};">`;
      html += `<div style="font-weight:700;color:#17191d;margin-bottom:4px;font-size:13px;">${college}</div>`;
      html += `<div style="font-size:12px;color:#4b5563;line-height:1.7;">`;
      html += `进复试:${enter} | 录取:${admit}<br>`;
      html += `复录比:<span class="${ratioClass(ratio)}">${ratio}</span> | 均分:<span class="${scoreClass(avgAdmit)}">${avgAdmit?avgAdmit.toFixed(1):'-'}</span>`;
      html += `</div>`;
      
      // 折叠按钮 + 子方向列表
      html += `<div style="margin-top:6px;">`;
      html += `<button onclick="toggleFold('${foldId}')" style="width:100%;padding:4px 8px;background:linear-gradient(135deg,#f0f9ff 0%,#e0f2fe 100%);border:1px solid #bae6fd;border-radius:6px;cursor:pointer;font-size:12px;color:#0369a1;display:flex;align-items:center;justify-content:center;gap:4px;transition:all .2s;" onmouseover="this.style.background='linear-gradient(135deg,#e0f2fe 0%,#bae6fd 100%)'" onmouseout="this.style.background='linear-gradient(135deg,#f0f9ff 0%,#e0f2fe 100%)'">`;
      html += `<span id="${foldId}-icon">▶</span> 方向详情 (${recs.length}个)`;
      html += `</button>`;
      
      html += `<div id="${foldId}" style="display:none;margin-top:6px;padding-top:6px;border-top:1px dashed #e2e8f0;">`;
      const idxColors = ['#FF5252','#FFB300','#ca8a04','#43A047','#0891b2','#2563eb','#7c3aed','#db2777','#c2410c','#059669'];
      recs.forEach((r,idx)=>{
        const code = r.majorCode || '';
        const name = r.majorName || '';
        const math = r.math || '-';
        const eng = r.english || '-';
        const course = r.course2 || '-';
        const cColor = idxColors[idx % idxColors.length];
        html += `<div style="font-size:11px;color:#6a6a7a;line-height:1.7;padding:3px 0;display:flex;align-items:flex-start;gap:4px;">`;
        html += `<span style="flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:${cColor};color:#fff;font-size:10px;font-weight:700;">${idx+1}</span>`;
        html += `<span style="word-break:break-all;">(${code})${name}：${math}+${eng}+${course}</span>`;
        html += `</div>`;
      });
      html += `</div>`;
      html += `</div>`;
      
      html += `</div>`;
    });
    
    html += `</div>`;
  });
  
  html += `</div>`;
  html += `</div>`;

  container.innerHTML = html;
}

function toggleFold(id){
  const el = document.getElementById(id);
  const icon = document.getElementById(id+'-icon');
  if(!el) return;
  if(el.style.display === 'none'){
    el.style.display = 'block';
    if(icon) icon.textContent = '▼';
  } else {
    el.style.display = 'none';
    if(icon) icon.textContent = '▶';
  }
}

// ===================== 页面初始化 =====================
(function(){
  const params = new URLSearchParams(location.search);
  const urlSchools = params.get('schools');
  
  if(urlSchools){
    // URL参数优先，覆盖缓存
    urlSchools.split(',').forEach(s=>{
      const name = decodeURIComponent(s.trim());
      if(ALL_SCHOOLS.includes(name) && !selectedSchools.includes(name)){
        selectedSchools.push(name);
      }
    });
    localStorage.setItem('pkSelectedSchools', JSON.stringify(selectedSchools));
  } else {
    // 无URL参数时，从localStorage加载
    const saved = localStorage.getItem('pkSelectedSchools');
    if(saved){
      try{
        const arr = JSON.parse(saved);
        arr.forEach(name=>{
          if(ALL_SCHOOLS.includes(name) && !selectedSchools.includes(name)){
            selectedSchools.push(name);
          }
        });
      }catch(e){}
    }
  }
  
  updateSelected();
  renderPk();
  
  // 显示返回上一级按钮
  const backBtn = document.getElementById('backBtn');
  if(backBtn) backBtn.style.display = 'inline-flex';
  
})();

// ===================== 导出分析图片 =====================
function exportPkImage(){
  if(selectedSchools.length < 2){
    alert('请至少选择2所院校后再导出');
    return;
  }
  
  const btn = document.querySelector('button[onclick="exportPkImage()"]');
  const originalText = btn.innerHTML;
  btn.innerHTML = '导出中...';
  btn.disabled = true;
  
  // 基础文件名
  const baseName = selectedSchools.join('vs');
  
  // 获取所有对比内容卡片（排除搜索区）
  const cards = document.querySelectorAll('#pkContent > .card');
  if(cards.length === 0){
    alert('暂无对比内容可导出');
    btn.innerHTML = originalText;
    btn.disabled = false;
    return;
  }
  
  // 添加导出专用样式
  const style = document.createElement('style');
  style.id = 'export-style';
  style.innerHTML = `
    .export-mode * {
      white-space: nowrap !important;
      word-break: keep-all !important;
      word-wrap: normal !important;
    }
    .export-mode .compare-table {
      table-layout: fixed !important;
      width: auto !important;
      min-width: 100% !important;
    }
    .export-mode .compare-table th,
    .export-mode .compare-table td {
      white-space: nowrap !important;
      text-align: center !important;
      vertical-align: middle !important;
      font-weight: 600 !important;
      font-size: 15px !important;
      padding: 8px 12px !important;
      line-height: 1.4 !important;
      height: auto !important;
    }
    .export-mode .compare-table .label-col {
      text-align: left !important;
      font-weight: 700 !important;
      white-space: nowrap !important;
      width: auto !important;
      min-width: 140px !important;
    }
    .export-mode h3 {
      font-size: 20px !important;
      font-weight: 700 !important;
      text-align: center !important;
      margin-bottom: 12px !important;
      white-space: nowrap !important;
    }
    .export-mode .school-tag,
    .export-mode .tier-985, .export-mode .tier-211, .export-mode .tier-syl, .export-mode .tier-sf,
    .export-mode .eval-a-plus, .export-mode .eval-a, .export-mode .eval-a-minus,
    .export-mode .eval-b-plus, .export-mode .eval-b, .export-mode .eval-b-minus,
    .export-mode .eval-c-plus, .export-mode .eval-c, .export-mode .eval-c-minus {
      font-weight: 700 !important;
      font-size: 24px !important;
      white-space: nowrap !important;
      display: inline-block !important;
      margin: 1px !important;
    }
    .export-mode tr {
      height: auto !important;
    }
    .export-mode div {
      line-height: 1.4 !important;
    }
  `;
  document.head.appendChild(style);
  
  // 逐个导出每个卡片
  let index = 0;
  function exportNext(){
    if(index >= cards.length){
      // 完成，清理
      document.head.removeChild(style);
      btn.innerHTML = originalText;
      btn.disabled = false;
      alert(`已导出 ${cards.length} 张对比图片`);
      return;
    }
    
    const card = cards[index];
    const title = card.querySelector('h3')?.textContent?.trim() || `对比${index+1}`;
    const fileName = `${baseName}_${title}.jpg`;
    
    // 添加导出模式类
    card.classList.add('export-mode');
    
    html2canvas(card, {
      scale: 2,
      useCORS: true,
      allowTaint: true,
      backgroundColor: '#ffffff',
      logging: false,
      width: card.scrollWidth,
      height: card.scrollHeight
    }).then(canvas => {
      const link = document.createElement('a');
      link.download = fileName;
      link.href = canvas.toDataURL('image/jpeg', 0.95);
      link.click();
      
      card.classList.remove('export-mode');
      index++;
      setTimeout(exportNext, 300); // 间隔300ms避免浏览器阻塞
    }).catch(err => {
      console.error('导出失败:', err);
      card.classList.remove('export-mode');
      index++;
      setTimeout(exportNext, 300);
    });
  }
  
  exportNext();
}

// ===================== 单击空白处信号脉冲效果 =====================
(function(){
  const isInteractive = function(el){
    if(!el) return false;
    const tag = el.tagName;
    if(['A','BUTTON','INPUT','SELECT','TEXTAREA','IMG','SVG','CANVAS','LABEL'].includes(tag)) return true;
    const cls = el.className || '';
    if(typeof cls === 'string' && /tag|clickable|btn|button|filter|select|nav-icon|back-btn|modal|chart/.test(cls)) return true;
    if(el.closest && (el.closest('a') || el.closest('button') || el.closest('label'))) return true;
    return false;
  };
  document.addEventListener('click', function(e){
    if(isInteractive(e.target)) return;
    const x = e.clientX, y = e.clientY;
    // 控制红信号脉冲
    const pulse = document.createElement('div');
    pulse.className = 'signal-pulse';
    pulse.style.left = (x - 6) + 'px';
    pulse.style.top = (y - 6) + 'px';
    document.body.appendChild(pulse);
    setTimeout(() => pulse.remove(), 700);
  });
})();

<script id="entry-a11y-adapt-js">
(function(){
  function enhanceClickableKeyboard(){
    document.querySelectorAll('[onclick]:not(button):not(a):not(input):not(select):not(textarea)').forEach(function(el){
      if(!el.hasAttribute('tabindex')) el.setAttribute('tabindex','0');
      if(!el.hasAttribute('role')) el.setAttribute('role','button');
      if(el.dataset.keyEnhanced === '1') return;
      el.dataset.keyEnhanced = '1';
      el.addEventListener('keydown', function(e){
        if(e.key === 'Enter' || e.key === ' '){
          e.preventDefault();
          el.click();
        }
      });
    });
  }
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', enhanceClickableKeyboard);
  }else{
    enhanceClickableKeyboard();
  }
})();
</script>
