function renderPosts(posts) {
  const container = document.getElementById('exp-grid');
  const noResults = document.getElementById('no-results');
  container.innerHTML = '';
  if (posts.length === 0) {
    noResults.style.display = 'block';
    return;
  }
  noResults.style.display = 'none';
  
  const yearStyle = {
    '25考研': 'background:#fff0f3;color:#fb7299;',
    '24考研': 'background:#e8f4ff;color:#00aeec;',
    '26考研': 'background:#fff3e0;color:#ff8f1f;',
  };
  
  const levelClass = {
    '985': 'tag-red',
    '211': 'tag-blue',
    '双一流': 'tag-purple',
    '双非': 'tag-green',
  };
  
  posts.forEach(p => {
    const yearBadge = '<span class="exp-card-year" style="' + (yearStyle[p.year]||yearStyle["25考研"]) + '">' + p.year + '</span>';
    const levelTag = '<span class="tag ' + (levelClass[p.level]||'tag-green') + '">' + p.level + '</span>';
    const catTag = '<span class="tag">' + p.category + '</span>';
    const scoreTag = p.total ? '<span class="tag tag-pink">总分' + p.total + '</span>' : '';
    const subTag = p.subjectScore ? '<span class="tag tag-orange">专业课' + p.subjectScore + '</span>' : '';
    const ugTag = p.undergrad ? '<span class="tag tag-cyan">本科' + p.undergrad + '</span>' : '';
    
    const card = document.createElement('a');
    card.href = 'experience/' + p.id + '.html';
    card.className = 'exp-card';
    card.innerHTML = yearBadge +
      '<div class="exp-card-title">' + p.title + '</div>' +
      '<div class="exp-card-tags">' + levelTag + catTag + scoreTag + subTag + ugTag + '</div>' +
      '<div style="margin-top:auto; font-size:.8rem; color:#9499a0;">' + (p.author ? '@' + p.author + ' · ' : '') + p.school + (p.code ? ' ' + p.code : '') + '</div>';
    container.appendChild(card);
  });
}

function getConditionFilters() {
  const search = document.getElementById('search-input').value.toLowerCase();
  const year = document.getElementById('filter-year').value;
  const level = document.getElementById('filter-level').value;
  const category = document.getElementById('filter-category').value;
  return { search, year, level, category };
}

function applyFilters(opts) {
  const { search, year, level, category, school } = opts;
  return POSTS.filter(p => {
    if (year && p.year !== year) return false;
    if (level && p.level !== level) return false;
    if (category && p.category !== category) return false;
    if (school && p.school !== school) return false;
    if (search) {
      const text = (p.title + p.school + p.schoolShort + p.code + p.category + p.level).toLowerCase();
      if (!text.includes(search)) return false;
    }
    return true;
  });
}

// 根据当前筛选条件（不含院校），动态更新院校标签云
function updateSchoolTags() {
  const { search, year, level, category } = getConditionFilters();
  // 先过滤出满足条件（不含院校）的结果
  const filtered = applyFilters({ search, year, level, category, school: '' });
  // 提取唯一院校并排序
  const schools = [...new Set(filtered.map(p => p.school))].sort();
  
  const container = document.getElementById('school-tags');
  let html = '<button class="school-tag active" data-school="">全部院校</button>';
  schools.forEach(s => {
    html += '<button class="school-tag" data-school="' + s + '">' + s + '</button>';
  });
  container.innerHTML = html;
}

// 条件筛选变化时：更新标签云 + 渲染卡片
function onConditionChange() {
  updateSchoolTags();
  const { search, year, level, category } = getConditionFilters();
  const filtered = applyFilters({ search, year, level, category, school: '' });
  renderPosts(filtered);
}

// 院校标签点击时：只渲染卡片（不更新标签云）
function onSchoolClick(school) {
  const { search, year, level, category } = getConditionFilters();
  const filtered = applyFilters({ search, year, level, category, school });
  renderPosts(filtered);
}

// 事件绑定：条件筛选框
['search-input', 'filter-year', 'filter-level', 'filter-category'].forEach(id => {
  const el = document.getElementById(id);
  if (!el) return;
  const eventType = (id === 'search-input') ? 'input' : 'change';
  el.addEventListener(eventType, onConditionChange);
});

// 事件绑定：院校标签点击
document.getElementById('school-tags').addEventListener('click', function(e) {
  if (e.target.classList.contains('school-tag')) {
    document.querySelectorAll('.school-tag').forEach(t => t.classList.remove('active'));
    e.target.classList.add('active');
    onSchoolClick(e.target.dataset.school || '');
  }
});

// 初始渲染
updateSchoolTags();
renderPosts(POSTS);
</script>

  btn.querySelector('button').addEventListener('click',function(){
    window.scrollTo({top:0,behavior:'smooth'});
